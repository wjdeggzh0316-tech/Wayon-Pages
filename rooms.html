<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wayon Rooms</title><style>body{font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f;padding:24px}</style>
<p id="status" role="status">Loading rooms…</p><button id="retry" hidden>Retry</button>
<script>
(() => {
 async function load(){try{
  const response=await fetch('./classroom.html?room-release='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('ROOM_UNAVAILABLE');
  let html=await response.text();
  let entries=[];
  try{
   const reservations=await fetch('./room-reservations.json?room-release='+Date.now(),{cache:'no-store'});
   if(reservations.ok){
    const data=await reservations.json();
    if(Array.isArray(data?.bookings))entries=data.bookings;
   }
  }catch(_){}
  const marker='const ALL = (', a=html.indexOf(marker)+marker.length, z=html.indexOf(').days || {};',a);
  if(a<marker.length || z<a)throw Error('ROOM_DATA_INVALID');
  const payload=JSON.parse(html.slice(a,z)), days=payload.days;
  const base=days[Object.keys(days).sort().pop()];
  if(!base?.rows || !base?.segs)throw Error('ROOM_DATA_INVALID');
  let skippedBookings=0;
  for(const b of entries){
   if(!b || typeof b!=='object' ||
      typeof b.day!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(b.day) ||
      typeof b.room!=='string' || !base.rows.includes(b.room) ||
      typeof b.start!=='string' || !/^\d{2}:\d{2}$/.test(b.start) ||
      typeof b.end!=='string' || !/^\d{2}:\d{2}$/.test(b.end) ||
      b.start>=b.end ||
      typeof b.label!=='string' ||
      typeof b.course!=='string'){
    skippedBookings++;
    continue;
   }
   if(!days[b.day]) days[b.day]={iso:b.day,rows:base.rows,segs:base.segs,cells:base.rows.map(()=>base.segs.map(()=>[['课表待更新','','','']])),teachers:[],online:[],unknown:[],missing:true,booking_preview:true};
   const day=days[b.day], ri=day.rows.indexOf(b.room);
   day.segs.forEach((seg,si)=>{
    const stop=seg[0]==='D'?'21:30':seg[2];if(!(b.start<stop&&b.end>seg[1]))return;
    const rows=day.cells[ri][si].filter(x=>x?.[0]!=='课表待更新');
    const span=x=>x[3]||seg[1]+'-'+seg[2];
    if(!rows.some(x=>x[0]===b.label && span(x)===b.start+'-'+b.end))rows.push([b.label,b.course+'（课表外）','',b.start+'-'+b.end]);
    day.cells[ri][si]=rows;
   });
  }
  if(skippedBookings>0){
   const warn='<span class="miss" id="booking-warning" style="font-size:12px;margin-left:8px;font-weight:600" role="status" title="预留数据异常">⚠️ '+skippedBookings+'条借用预留格式异常已忽略</span>';
   html=html.replace('<b>教室使用</b>','<b>教室使用</b>'+warn);
  }
  html=html.slice(0,a)+JSON.stringify(payload).replace(/<\//g,'<\\/')+html.slice(z);
  html=html.replace('.sort().slice(0, 3).forEach(d =>','.sort().slice(0, 7).forEach(d =>');
  html=html.replace('这天还没生成','课表待更新；已显示借用预留');
  html=html.replace('.days || {};\\nconst $','.days || {};\nconst $');
  html=html.replace(/import\(\s*(['"])\.\/checks-sync\.mjs(?:\?[^'"]*)?\1\s*\)/g,()=>"import('./checks-sync.mjs?room-release="+Date.now()+"')");
  if(!html.includes('function roomBlockVisible(')){
    html=html.replace('function render() {',"// A lesson card appears in its first occupied slot; raw occupancy remains intact.\nfunction roomBlockVisible(x, ri, si) {\n  if (ri === HALL || !x || !/^\\d{2}:\\d{2}-\\d{2}:\\d{2}$/.test(x[3] || '')) return true;\n  for (let previous = 0; previous < si; previous++) {\n    if (items(ri, previous).some(other => other && same(other, x))) return false;\n  }\n  return true;\n}\n"+'function render() {');
    html=html.replace("arr.forEach((x, i) => c.append(block(x, ri, si, i)));","arr.forEach((x, i) => { if (roomBlockVisible(x, ri, si)) c.append(block(x, ri, si, i)); });");
  }
  const layout='<script src="./room-layout.js?release='+Date.now()+'"><'+'/script>';
  html=html.replace('</head>',layout+'</head>');
  document.open();document.write(html);document.close();
 }catch{document.getElementById('status').textContent='Could not load rooms. Saved records are unchanged.';document.getElementById('retry').hidden=false;}}
 document.getElementById('retry').onclick=load;void load();
})();
</script></html>
