<body class="wayon-room">

<div class="top"><b>教室使用</b><span id="cf"></span><span class="days" id="days"></span><span class="sync" id="sync"></span></div>
<div class="legend" id="lg"></div>
<div class="room-scroll" role="region" aria-label="教室使用表，可横向滚动" tabindex="0"><div class="grid" id="g"></div></div>
<div class="foot" id="f"></div>
<div class="sheet" id="sh" role="dialog" aria-label="修改格子">
  <div class="t" id="sht"></div>
  <textarea id="sha" placeholder="一行一节：学生 科目 老师（清空 = 空闲）"></textarea>
  <div class="row"><button class="pri" id="bs" type="button">保存</button><button id="bc" type="button">清空</button><button id="br" type="button">恢复课表原样</button><button id="bx" type="button">取消</button></div>
  <div class="hint">只改这张表，不会改小SaaS 课表、不写备忘录。课程块可以按住拖到别的格子。</div>
</div>
<script>
const ALL = ({"days": {"2026-10-27": {"iso": "2026-10-27", "rows": ["1号教室", "2号教室", "3号教室", "5号教室", "校长室", "大厅（自习）"], "segs": [["A", "08:30", "10:30"], ["B", "10:40", "12:40"], ["C", "13:30", "15:30"], ["D", "15:40", "17:40"]], "cells": [[[], [], [], []], [[], [], [], []], [[], [], [], []], [[], [], [], []], [[], [], [], []], [[], [], [], []]], "teachers": [], "online": ["「郭璟Jack 」 SAT语法 08:30"], "unknown": [], "date": "10/27"}, "2026-10-28": {"iso": "2026-10-28", "rows": ["1号教室", "2号教室", "3号教室", "5号教室", "校长室", "大厅（自习）"], "segs": [["A", "08:30", "10:30"], ["B", "10:40", "12:40"], ["C", "13:30", "15:30"], ["D", "15:40", "17:40"]], "cells": [[[], [], [], []], [[], [["「李培生」", "听力", "王银屏", ""]], [], []], [[], [], [], []], [[], [], [], []], [[], [], [], []], [[], [], [["「李培生」", "课后", "", ""]], [["「李培生」", "课后", "", ""]]]], "teachers": ["王银屏"], "online": [], "unknown": [], "date": "10/28"}}}).days || {};
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
// 2026-10-05 Leo：今天、明天两天可切换；打开默认今天（北京时间），不记上次看的日期
const today = new Date().toLocaleDateString("en-CA", {timeZone: "Asia/Shanghai"});
const shiftD = (d, n) => { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const tomorrow = shiftD(today, 1);
const relD = d => (d === today ? "今天 " : d === tomorrow ? "明天 " : "");
const mdD = d => { const p = d.split("-"); return Number(p[1]) + "/" + Number(p[2]); };
const BASE = ALL[Object.keys(ALL).sort().pop()] || {rows: ["1号教室", "2号教室", "3号教室", "5号教室", "校长室", "大厅（自习）"], segs: [["A", "08:30", "10:30"], ["B", "10:40", "12:40"], ["C", "13:30", "15:30"], ["D", "15:40", "17:40"]]};
const blank = iso => ({iso, rows: BASE.rows, segs: BASE.segs, cells: BASE.rows.map(() => BASE.segs.map(() => [])), teachers: [], online: [], unknown: [], missing: true});
let curD = today, DATA = ALL[curD] || blank(curD);
const R = BASE.rows, S = BASE.segs, HALL = R.length - 1;
const PAL = ["1", "2", "3", "4"];
let tcol = {}, LKEY = "";
let ed = {};   // 手改过的格子：{"行-段": [[学生, 科目, 老师, 时间], …]}，每天分开存
const norm = o => { const r = {}; Object.keys(o || {}).forEach(k => { const v = o[k];
  r[k] = Array.isArray(v) ? v : String(v).split("\n").map(s => s.trim()).filter(Boolean).map(s => [s, "", "", ""]); }); return r; };
const key = (ri, si) => ri + "-" + si;
const has = k => Object.prototype.hasOwnProperty.call(ed, k);
const SEATS = 14;   // 大厅一共 14 个座位（Leo 2026-10-05），一个学生占一个；超过 14 人照样显示并标红
const padH = a => { const r = (a || []).slice(); while (r.length < SEATS) r.push(null); return r; };
const seated = arr => arr.filter(Boolean).length;
const orig = (ri, si) => ri === HALL ? padH(DATA.cells[ri][si]) : DATA.cells[ri][si];
const items = (ri, si) => has(key(ri, si)) ? (ri === HALL ? padH(ed[key(ri, si)]) : ed[key(ri, si)]) : orig(ri, si);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const toText = arr => arr.filter(Boolean).map(x => x.filter(Boolean).join(" ")).join("\n");
function setCell(ri, si, arr) {
  const k = key(ri, si);
  if (arr === null || same(ri === HALL ? padH(arr) : arr, orig(ri, si))) delete ed[k]; else ed[k] = arr;
}
let undoTo = null;
function commit(before) { render(); undoTo = before === undefined ? null : before; try { localStorage.setItem(LKEY, JSON.stringify(ed)); } catch (e) {} push(); }
const g = $("g");
// 2026-10-05 Leo：横竖对调——横 = 教室（最后一列大厅，宽一些），竖 = 课段
g.style.gridTemplateColumns = "minmax(40px,.5fr) repeat(" + (R.length - 1) + ",minmax(0,1fr)) minmax(0,1.4fr)";
g.style.gridTemplateRows = "auto repeat(" + S.length + ",minmax(0,1fr))";
const at = (e, ri, si) => { e.style.gridRow = si + 2; e.style.gridColumn = ri + 2; return e; };
function block(x, ri, si, idx) {
  const hall = ri === HALL && !x[2], col = tcol[x[2]] || "5", b = el("div", "k");
  b.style.background = hall ? "var(--hall)" : "var(--t" + col + ")";
  b.style.borderLeftColor = hall ? "var(--hallb)" : "var(--t" + col + "b)";
  b.append(el("div", "w", (x[0] || "").replace(/[【】]/g, "")));
  const sub = [x[1], x[2]].filter(Boolean).join("·");
  if (sub) b.append(el("div", "s", sub));
  if (x[3]) b.append(el("div", "tt", x[3]));
  b.addEventListener("pointerdown", e => startDrag(e, b, x, ri, si, idx));
  return b;
}
// A lesson card appears in its first occupied slot; raw occupancy remains intact.
function roomBlockVisible(x, ri, si) {
  if (ri === HALL || !x || !/^\d{2}:\d{2}-\d{2}:\d{2}$/.test(x[3] || '')) return true;
  for (let previous = 0; previous < si; previous++) {
    if (items(ri, previous).some(other => other && same(other, x))) return false;
  }
  return true;
}
function render() {
  g.textContent = "";
  const corner = el("div", "h", ""); corner.style.gridRow = 1; corner.style.gridColumn = 1; g.append(corner);
  S.forEach((s, si) => { const h = el("div", "r", s[0]); h.style.flexDirection = "column"; h.append(el("span", "hcnt", s[1] + "-" + s[2])); h.style.gridRow = si + 2; h.style.gridColumn = 1; g.append(h); });
  let bad = 0, maxHall = 0;
  R.forEach((rn, ri) => {
    const rl = el("div", "h", rn.replace("教室", "").replace("（自习）", ""));
    if (ri === HALL) rl.append(el("small", "", "14 座"));
    rl.style.gridRow = 1; rl.style.gridColumn = ri + 2;
    g.append(rl);
    S.forEach((s, si) => {
      if (ri === HALL) {   // 大厅：一个课段 = 6 个小座位，空座虚线，点空座可填人，学生可拖到别的座位
        const harr = items(ri, si), n = seated(harr);
        const hb = el("div", "hallbox" + (has(key(ri, si)) ? " man" : "") + (n > SEATS ? " over" : ""));
        hb.title = "大厅 " + s[0] + " 段：已坐 " + n + " / " + SEATS;
        if (n > maxHall) maxHall = n;
        harr.forEach((x, k) => {
          const c = el("div", "c seat " + (x ? "used" : "free"));
          c.dataset.ri = ri; c.dataset.si = si; c.dataset.seat = k; c.tabIndex = 0; c.setAttribute("role", "button");
          c.setAttribute("aria-label", "大厅 " + s[0] + " 段 座位 " + (k + 1));
          const pre = x && x[1] === "课后";   // 上完课自动放进来的 = 预占（Leo 2026-10-05），点一下改成确定
          if (x) { const b = block(x, ri, si, k); b.classList.add("chip"); if (pre) b.classList.add("pre");   // 虚线框 = 预占（图例里写明），格子太小不另写字
            b.title = (x[0] || "").replace(/[【】]/g, "") + (pre ? "（预占：上完课，点一下改成确定）" : x[1] ? "（" + x[1] + "）" : "");
            const del = el("button", "x", "×"); del.type = "button"; del.setAttribute("aria-label", "从这个时段的大厅删除 " + (x[0] || "").replace(/[【】]/g, ""));
            del.addEventListener("pointerdown", e => e.stopPropagation());
            del.onclick = e => { e.stopPropagation(); const before = JSON.stringify(ed); const a2 = items(ri, si).slice(); a2[k] = null; setCell(ri, si, a2); commit(before); };
            b.append(del); c.append(b); }
          c.onclick = () => { if (dragged) return;
            if (pre) { const before = JSON.stringify(ed); const a2 = items(ri, si).slice(); a2[k] = [x[0], "确定", "", x[3] || ""]; setCell(ri, si, a2); commit(before); }
            else openSheet(ri, si, k); };
          c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(ri, si, k); } };
          hb.append(c);
        });
        g.append(at(hb, ri, si)); return;
      }
      const arr = items(ri, si), c = el("div", "c");
      c.dataset.ri = ri; c.dataset.si = si; c.tabIndex = 0; c.setAttribute("role", "button");
      if (has(key(ri, si))) c.classList.add("man");
      if (!arr.length) { c.classList.add("free"); c.textContent = ri === HALL ? "" : "空"; }
      else {
        c.classList.add("used");
        let hasConflict = false;
        if (ri !== HALL && arr.length > 1) {
          const parseSpan = x => (x[3] && x[3].includes("-")) ? x[3].split("-").map(t => t.trim()) : [S[si][1], S[si][2]];
          for (let i = 0; i < arr.length; i++) {
            for (let j = i + 1; j < arr.length; j++) {
              const [s1, e1] = parseSpan(arr[i]), [s2, e2] = parseSpan(arr[j]);
              if (s1 < e2 && e1 > s2) { hasConflict = true; break; }
            }
            if (hasConflict) break;
          }
        }
        if (hasConflict) { c.classList.add("bad"); bad++; }
        arr.forEach((x, i) => { if (roomBlockVisible(x, ri, si)) c.append(block(x, ri, si, i)); });
      }
      c.onclick = () => { if (!dragged) openSheet(ri, si); };
      c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(ri, si); } };
      g.append(at(c, ri, si));
    });
  });
  $("cf").className = DATA.missing ? "miss" : (bad || maxHall > SEATS) ? "no" : "ok";
  $("cf").textContent = DATA.missing ? "这天还没生成" : (bad ? "⚠️ " + bad + " 处教室冲突" : "✓ 无冲突") + (maxHall > SEATS ? " · ⚠️ 大厅超员" : " · 大厅最多 " + maxHall + "/" + SEATS);
  const dl = $("days"); dl.textContent = "";
  [...new Set([today, tomorrow, ...Object.keys(ALL).filter(d => d >= today)])].sort().slice(0, 7).forEach(d => {
