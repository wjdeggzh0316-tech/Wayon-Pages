*{box-sizing:border-box}body{font-family:var(--sans);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg)}

.wayon-workbench .copy,.wayon-workbench .small{min-height:36px;border-radius:9px;font-size:12px;font-weight:500;padding:7px 11px;border:1px solid var(--line);background:var(--code-bg);color:var(--fg-secondary);white-space:nowrap;transition:background .16s,color .16s}

<body class="wayon-workbench">

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <h1 class="brand-title">Wayon</h1>
      <div class="brand-sub"><span id="ttl"></span> · <span id="d"></span></div>
    </div>
    
    <div class="nav-section">
      <div class="section-label">工作板块</div>
      <div class="nav-tabs" id="tabs"></div>
    </div>

    <div class="nav-section date-section">
      <div class="section-label">日期切换</div>
      <div class="days" id="days"></div>
    </div>

    <div class="sidebar-footer">

    el.append(head);
    if (openEditors.has(r[0])) {
      const editor = document.createElement("div"); editor.className = "task-editor";

      ta.placeholder = "可直接粘贴群内任务安排，例如：\n【" + r[0] + "】10月17日任务安排\n1、单词抽背\n2、听力精练\n3、课后作业";
      const btnRow = document.createElement("div"); btnRow.style.display = "flex"; btnRow.style.gap = "8px"; btnRow.style.marginTop = "6px"; btnRow.style.flexWrap = "wrap";

      tx.oninput=sizeText;requestAnimationFrame(sizeText);

        s.tk[i] = next;

      const note = document.createElement("input"); note.className = "note"; note.id = "n-" + ri + "-" + i; note.placeholder = "备注（可不填）"; note.value = nt(s, t, i); note.setAttribute("aria-label",r[0]+"的第"+(i+1)+"项备注");
      note.oninput = () => { s.n[i] = note.value; if (s.c) { s.c = ""; } save(); pre.textContent = text(r); summary(rows); };
      const del = document.createElement("button"); del.type = "button"; del.className = "del-btn"; del.id = "del-" + ri + "-" + i;
      del.textContent = "×"; del.title = "删除此任务";del.setAttribute("aria-label","删除第"+(i+1)+"项任务");
      del.onclick = () => {

        const newM = {}, newN = {};
        Object.keys(s.m || {}).forEach(k => {

          else if (idx > i) newM[idx - 1] = s.m[idx];
        });
        Object.keys(s.n || {}).forEach(k => {

      row.append(m, tx, note, del); tasks.append(row);
    });
    const opRow = document.createElement("div"); opRow.style.display = "flex"; opRow.style.gap = "8px"; opRow.style.marginTop = "4px"; opRow.style.alignItems = "center"; opRow.style.flexWrap = "wrap";
    const addBtn = document.createElement("button"); addBtn.type = "button"; addBtn.className = "small add-btn";
    addBtn.textContent = "+ 添加一项任务";
    addBtn.onclick = () => {

document.getElementById("reset").onclick = () => { if (mode === "notice") { nc = {}; nsave(); } else if (mode === "quiz") { qz = {}; qsave(); } else if (mode === "plan") { ps = {}; psave(); } else if (mode === "chasing") { ch = {}; chsave(); } else { st = {}; save(); } render(); };

// Manual checks use semantic task keys; array order never identifies a mark.

const readLocal = (k) => {try{return JSON.parse(localStorage.getItem(k)||'{}')||{};}catch(e){return {};}};
function taskKeys(day, doneOverride) {
  const done = doneOverride || (day === cur ? st : readLocal('wayon-done-' + day));
  const result = [];
  for(const r of DATA[day] || []) {
    const seen = {};
    const d = done[r[0]];
    const tasks = (d && Array.isArray(d.tk)) ? d.tk.map(x => [x, '', '']) : (r[3] || []);
    tasks.forEach((t, i) => {
      const occurrence = seen[t[0]] || 0; seen[t[0]] = occurrence + 1;
      const classIds = ((DATA._cids || {})[day] || {})[r[0]] || [];
      result.push({name: r[0], i, key: ['task', r[0], r[1], JSON.stringify(classIds.slice().sort()), t[0], occurrence]});
    });
  }
  return result;
}
function captureChecks(day) {
  const done=day===cur ? st : readLocal('wayon-done-'+day);
  const quiz=day===cur && qzDay===cur ? qz : readLocal(qkey(day));
  const plan=day===cur ? ps : readLocal('wayon-plan-'+day);
  const out={};
  for(const {name,i,key:k} of taskKeys(day, done)) {
    const d=done[name];if(!d) continue;
    if(Object.hasOwn(d.m||{},i)) out[JSON.stringify([...k,'mark'])]=d.m[i];
    if(Object.hasOwn(d.n||{},i)) out[JSON.stringify([...k,'note'])]=d.n[i];
  }
  for(const [name,d] of Object.entries(done)) {
    if(d.c) out[JSON.stringify(['done-copy',name])]=d.c;
    if(Array.isArray(d.tk)) out[JSON.stringify(['student-tasks',name])]=d.tk;
  }
  for(const [name,t] of Object.entries(plan)) if(t) out[JSON.stringify(['plan-copy',name])]=t;
  for(const [name,q] of Object.entries(quiz)) for(const part of ['pre','post'])
    if(q[part]===true) out[JSON.stringify(['quiz',name,part])]=true;
  for(const [name,val] of Object.entries(day===today ? cstops : {})) {
    if(val && (Array.isArray(val) || Array.isArray(val.stopped_ids)))
      out[JSON.stringify(['chasing-stop',name])]=val;
  }
  const notices = day===ncDay ? nc : readLocal(nkey(day));
  for(const [id, value] of Object.entries(notices)) {
    let k; try{k=JSON.parse(id);}catch(e){continue;}
    if(Array.isArray(k) && k.length===2 && value?.copied_at && typeof value.signature==='string') out[JSON.stringify(['notice-copy-v2',day,...k])]=value;
  }
  return out;
}
function applyChecks(day, fields) {
  const done={},quiz={},plan={},notices={};
  for(const [raw,value] of Object.entries(fields)) {
    let k;try{k=JSON.parse(raw);}catch(e){continue;}
    if(k[0]==='student-tasks' && Array.isArray(value)) {
      (done[k[1]] ||= {m:{},n:{},c:''}).tk = value;
    }
  }
  const tasks=new Map(taskKeys(day, done).map(x=>[JSON.stringify(x.key),x]));
  for(const [raw,value] of Object.entries(fields)) {
    let k;try{k=JSON.parse(raw);}catch(e){continue;}
    if(k[0]==='task') {
      const part=k.pop(), match=tasks.get(JSON.stringify(k));if(!match)continue;
      const d=done[match.name] ||= {m:{},n:{},c:''};
      if(part==='mark' && ['', 'ok','no'].includes(value))d.m[match.i]=value;
      if(part==='note' && typeof value==='string')d.n[match.i]=value;
    } else if(k[0]==='quiz' && ['pre','post'].includes(k[2]) && value===true) {
      (quiz[k[1]] ||= {pre:false,post:false})[k[2]]=true;
    } else if(k[0]==='plan-copy' && typeof value==='string')plan[k[1]]=value;
    else if(k[0]==='done-copy' && typeof value==='string')(done[k[1]] ||= {m:{},n:{},c:''}).c=value;
    else if(k[0]==='chasing-stop') {
      if(value && (typeof value==='object' || Array.isArray(value))) cstops[k[1]]=value;
      else if(value===null) delete cstops[k[1]];
    } else if(k[0]==='notice-copy-v2' && k[1]===day && k.length===4 && value && typeof value.signature==='string' && value.copied_at) {
      notices[JSON.stringify(k.slice(2))]=value;
    }
  }
  localStorage.setItem(nkey(day),JSON.stringify(notices));
  if(day===ncDay) nc=notices;
  localStorage.setItem(cskey, JSON.stringify(cstops));
  // Retain the legacy device snapshot once; never silently upload old index-based marks.
  const backup='wayon-before-cloud-'+day;
  if(!localStorage.getItem(backup))localStorage.setItem(backup,JSON.stringify({done:readLocal('wayon-done-'+day),quiz:readLocal(qkey(day)),plan:readLocal('wayon-plan-'+day)}));
  localStorage.setItem('wayon-done-'+day,JSON.stringify(done));
  localStorage.setItem(qkey(day),JSON.stringify(quiz));
  localStorage.setItem('wayon-plan-'+day,JSON.stringify(plan));
  if(day===cur) {st=done;ps=plan;qz=quiz;qzDay=day;}
  if(day===cur || (mode==='notice' && day===curN)) render();
}
