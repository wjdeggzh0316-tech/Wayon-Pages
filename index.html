      const note = document.createElement("input"); note.className = "note"; note.id = "n-" + ri + "-" + i; note.placeholder = "备注（可不填）"; note.value = nt(s, t, i);
      note.oninput = () => { s.n[i] = note.value; if (s.c) { s.c = ""; } save(); pre.textContent = text(r); summary(rows); };
      row.append(m, tx, note); tasks.append(row);
    });
    el.append(head, tasks, pre);
    placeCard(el, !!s.c, "done:" + cur + ":" + r[0], (ri+1) + ".【" + r[0] + "】", s.c, bottomD);
  });
  bottomD.forEach(e => list.append(e));
  summary(rows);
}
document.getElementById("reset").onclick = () => { if (mode === "notice") { nc = {}; nsave(); } else if (mode === "quiz") { qz = {}; qsave(); } else if (mode === "plan") { ps = {}; psave(); } else if (mode === "chasing") { ch = {}; chsave(); } else { st = {}; save(); } render(); };
load(); pload(); render();
// 云端同步（2026-10-05）：在 claude.ai 打开时，打勾/备注/已复制 存到 artifact 数据库（集合 wayon_tasks，文档 = 日期），
// 手机和电脑看到同一份，Claude 也能读；本地双击打开时没有 claude，照旧只存这台浏览器。
let DB = null, unsub = null, wq = Promise.resolve();
const wts = {};
const syncEl = document.getElementById("sync");
const setSync = t => { syncEl.textContent = t; };
setSync("打勾状态只保存在这台设备的浏览器里。");
function push(){
  if (!DB) return;
  if (qzDay !== cur) qload();
  const day = cur, body = {done: JSON.stringify(st), plan: JSON.stringify(ps), quiz: JSON.stringify(qz), at: new Date().toISOString()};
  clearTimeout(wts[day]);
  wts[day] = setTimeout(() => {
    wq = wq.then(() => DB.doc("wayon_tasks/" + day).set(body))
      .then(() => setSync("☁️ 已同步到云端：手机、电脑打开都是同一份。"),
            e => setSync("⚠️ 云端保存失败（" + ((e && e.code) || "unknown") + "），这台设备上已保存。"));
  }, 500);
}
function watch(){
  if (!DB) return;
  if (unsub) unsub();
  const day = cur;
  unsub = DB.doc("wayon_tasks/" + day).onSnapshot(snap => {
    if (day !== cur) return;
    if (!snap.exists) {   // 云端还没有：把这台设备以前标的传上去
      let had = false; try { had = !!(localStorage.getItem(key()) || localStorage.getItem(pkey()) || localStorage.getItem(qkey(day))); } catch(e) {}
      if (had) push();
      return;
    }
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    const d = snap.data() || {}; let ns = {}, np = {}, nq = {};
    try { ns = JSON.parse(d.done || "{}") || {}; } catch(e) {}
    try { np = JSON.parse(d.plan || "{}") || {}; } catch(e) {}
    try { nq = JSON.parse(d.quiz || "{}") || {}; } catch(e) {}
    if (qzDay !== cur) qload();
    if (JSON.stringify(ns) === JSON.stringify(st) && JSON.stringify(np) === JSON.stringify(ps) && JSON.stringify(nq) === JSON.stringify(qz)) return;
    const a = document.activeElement;
    if (a && a.classList && a.classList.contains("note")) return;   // 正在写备注时不打断
    st = ns; ps = np; qz = nq; qzDay = day;
    try { localStorage.setItem(key(), JSON.stringify(st)); localStorage.setItem(pkey(), JSON.stringify(ps)); localStorage.setItem(qkey(day), JSON.stringify(qz)); } catch(e) {}
    render();
  }, e => setSync("⚠️ 云端同步中断（" + ((e && e.code) || "unknown") + "），刷新页面可重连。"));
}
function npush(){
  if (!DB) return;
  const id = nId(curN), body = {copied: JSON.stringify(nc), at: new Date().toISOString()};
  clearTimeout(nwt);
  nwt = setTimeout(() => { nq = nq.then(() => DB.doc("wayon_notice/" + id).set(body)).then(() => setSync("☁️ 已同步到云端：手机、电脑打开都是同一份。"),
    e => setSync("⚠️ 云端保存失败（" + ((e && e.code) || "unknown") + "），这台设备上已保存。")); }, 300);
}
function nwatch(){
  if (!DB) return;
  if (unsubN) unsubN();
  const day = curN;
  unsubN = DB.doc("wayon_notice/" + nId(day)).onSnapshot(snap => {
    if (day !== curN) return;
    if (ncDay !== curN) nload();
    if (!snap.exists) { if (Object.keys(nc).length) npush(); return; }
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    let x = {}; try { x = JSON.parse((snap.data() || {}).copied || "{}") || {}; } catch(e) {}
    if (JSON.stringify(x) === JSON.stringify(nc)) return;
    nc = x; try { localStorage.setItem(nkey(day), JSON.stringify(nc)); } catch(e) {}
    if (mode === "notice") render();
  }, e => setSync("⚠️ 云端同步中断（" + ((e && e.code) || "unknown") + "），刷新页面可重连。"));
}
if (typeof claude !== "undefined" && claude && claude.use) {
  claude.use("db").then(db => {
    if (!db) return;
    DB = db; setSync("☁️ 云端同步已开启：手机、电脑打开都是同一份。"); watch(); nwatch();
  }, () => {});
}
</script>
