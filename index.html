<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayon 任务清单 10/16</title>
<style>
/* ========================================================
   Wayon Workbench — Modern Dashboard with Responsive Sidebar
   ======================================================== */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --card-elevated: #ffffff;
  --fg: #1d1d1f;
  --fg-secondary: #48484a;
  --muted: #86868b;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.16);
  
  /* Apple & Claude Accents */
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-subtle: #f0f7ff;
  --claude-warm: #d97757;
  --claude-bg: #faf9f5;
  --claude-border: #e8e6df;
  
  /* States */
  --done: #34c759;
  --done-dark: #15803d;
  --done-bg: #f0fdf4;
  --done-border: #bbf7d0;
  
  --bad: #ff3b30;
  --bad-dark: #b91c1c;
  --bad-bg: #fef2f2;
  --bad-border: #fecaca;
  
  --code-bg: #f5f5f7;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
  --shadow-card: 0 4px 18px -2px rgba(0, 0, 0, 0.04), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
  --shadow-hover: 0 8px 26px -4px rgba(0, 0, 0, 0.08);
  
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1c1c1e;
    --card-elevated: #2c2c2e;
    --fg: #f5f5f7;
    --fg-secondary: #aeaeb2;
    --muted: #86868b;
    --line: rgba(255, 255, 255, 0.12);
    --line-strong: rgba(255, 255, 255, 0.22);
    --accent: #2997ff;
    --accent-hover: #47a6ff;
    --accent-subtle: #142334;
    --claude-warm: #e08b6d;
    --claude-bg: #1e1d1b;
    --claude-border: #383531;
    --done: #30d158;
    --done-dark: #4ade80;
    --done-bg: #0d2616;
    --done-border: #166534;
    --bad: #ff453a;
    --bad-dark: #f87171;
    --bad-bg: #2d1413;
    --bad-border: #991b1b;
    --code-bg: #141415;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.45);
    --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --fg: #f5f5f7;
  --fg-secondary: #aeaeb2;
  --muted: #86868b;
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.22);
  --accent: #2997ff;
  --accent-hover: #47a6ff;
  --accent-subtle: #142334;
  --claude-warm: #e08b6d;
  --claude-bg: #1e1d1b;
  --claude-border: #383531;
  --done: #30d158;
  --done-dark: #4ade80;
  --done-bg: #0d2616;
  --done-border: #166534;
  --bad: #ff453a;
  --bad-dark: #f87171;
  --bad-bg: #2d1413;
  --bad-border: #991b1b;
  --code-bg: #141415;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.45);
  --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.app-layout {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

#tab-plan::before { content: "📋 "; }
#tab-done::before { content: "✅ "; }
#tab-quiz::before { content: "📝 "; }
#tab-notice::before { content: "📢 "; }
#tab-chasing::before { content: "⚡ "; }
#tab-classroom::before { content: "🏫 "; }

@media (min-width: 860px) {
  .sidebar {
    width: 250px;
    flex: none;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    background: var(--card);
    border-right: 1px solid var(--line);
    padding: 24px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 1px 0 0 rgba(0, 0, 0, 0.02);
  }

  .sidebar-top {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .brand-title {
    font-size: 28px;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.1;
    color: var(--fg);
  }

  .brand-sub {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: -0.01em;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
    padding-left: 6px;
  }

  #tabs {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #tabs button {
    width: 100%;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--fg-secondary);
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  #tabs button:hover {
    background: rgba(0, 0, 0, 0.04);
    color: var(--fg);
  }

  #tabs button.on {
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0, 113, 227, 0.28);
  }

  #days {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 2px 4px;
  }

  #days button {
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    background: rgba(0, 0, 0, 0.04);
    border: 1px solid transparent;
    color: var(--fg-secondary);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  #days button:hover {
    background: rgba(0, 0, 0, 0.08);
    color: var(--fg);
  }

  #days button.on {
    background: var(--fg);
    color: var(--bg);
    font-weight: 600;
  }

  .sidebar-footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(0, 0, 0, 0.02);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .bar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .bar-lbl {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
  }

  .count {
    font-size: 13px;
    font-weight: 700;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  .track {
    width: 100%;
    height: 6px;
    border-radius: 9999px;
    background: rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    border-radius: 9999px;
    background: linear-gradient(90deg, #34c759, #30b0c7);
    width: 0;
    transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #reset {
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  #reset:hover {
    color: var(--bad);
    border-color: var(--bad);
    background: var(--bad-bg);
  }

  #sync {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 9999px;
    background: rgba(0, 0, 0, 0.03);
    border: 1px solid var(--line);
    white-space: nowrap;
    width: fit-content;
  }

  .main-content {
    flex: 1;
    min-width: 0;
    padding: 24px 32px 64px;
    overflow-y: auto;
  }

  #schedule-health {
    margin-bottom: 16px;
  }

  .list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    align-items: start;
  }
}

@media (min-width: 1340px) {
  .list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }
}

@media (max-width: 859px) {
  .app-layout {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    padding: 16px 16px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }

  .brand-title {
    font-size: 24px;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--fg);
  }

  .brand-sub {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .section-label {
    display: none;
  }

  #tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #tabs::-webkit-scrollbar { display: none; }

  #tabs button {
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--fg-secondary);
    white-space: nowrap;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }

  #tabs button.on {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    font-weight: 600;
  }

  #days {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #days::-webkit-scrollbar { display: none; }

  #days button {
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    background: rgba(0, 0, 0, 0.04);
    border: 1px solid transparent;
    color: var(--fg-secondary);
    white-space: nowrap;
    flex: none;
    cursor: pointer;
  }

  #days button.on {
    background: var(--fg);
    color: var(--bg);
    font-weight: 600;
  }

  .sidebar-footer {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 14px;
    flex-wrap: wrap;
  }

  .bar-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bar-lbl {
    display: none;
  }

  .track {
    flex: 1;
    min-width: 100px;
    height: 6px;
    border-radius: 9999px;
    background: rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    border-radius: 9999px;
    background: linear-gradient(90deg, #34c759, #30b0c7);
    width: 0;
  }

  .count {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--fg);
    white-space: nowrap;
  }

  #reset {
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 9999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }

  #sync {
    font-size: 11px;
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 9999px;
    background: var(--card);
    border: 1px solid var(--line);
    width: fit-content;
  }

  .main-content {
    padding: 12px 14px 48px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
}

#schedule-health {
  font-size: 12.5px;
  line-height: 1.4;
}
#schedule-health:empty {
  display: none;
}
#schedule-health:not(:empty) {
  background: #fffbeb;
  border: 1px solid #fde68a;
  color: #92400e;
  border-radius: 10px;
  padding: 8px 14px;
}
@media (prefers-color-scheme: dark) {
  #schedule-health:not(:empty) {
    background: #2d2412;
    border-color: #634311;
    color: #fde68a;
  }
}

.item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--shadow-card);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.item:hover {
  box-shadow: var(--shadow-hover);
}
.item.copied {
  border-color: rgba(52, 199, 89, 0.4);
}
.item.folded {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--done-bg);
  border-color: var(--done-border);
  color: var(--done-dark);
  font-weight: 600;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  grid-column: 1 / -1;
}

.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px 10px;
  flex-wrap: wrap;
}

.name {
  font-weight: 700;
  font-size: 16.5px;
  line-height: 1.3;
  color: var(--fg);
  letter-spacing: -0.015em;
  flex: 1 1 100%;
  min-width: 0;
  word-break: break-word;
}

.meta {
  color: var(--muted);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  flex: 1 1 auto;
  margin-right: auto;
  font-weight: 450;
}

.state {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--done-dark);
  background: var(--done-bg);
  border: 1px solid var(--done-border);
  padding: 2px 8px;
  border-radius: 9999px;
  white-space: nowrap;
}

.copy {
  background: var(--accent);
  border: none;
  color: #ffffff;
  font-weight: 600;
  font-size: 12.5px;
  border-radius: 9999px;
  white-space: nowrap;
  padding: 6px 14px;
  box-shadow: 0 2px 6px rgba(0, 113, 227, 0.22);
  cursor: pointer;
  transition: all 0.15s ease;
}
.copy:hover {
  filter: brightness(1.08);
  transform: scale(1.02);
}
.copy:active {
  transform: scale(0.98);
}
.item.copied .copy {
  background: var(--done-bg);
  color: var(--done-dark);
  border: 1px solid var(--done-border);
  box-shadow: none;
}

.small {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 9999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--fg-secondary);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
}
.small:hover {
  border-color: var(--line-strong);
  color: var(--fg);
  background: var(--code-bg);
}

.tasks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 2px;
}

.task {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  border-radius: 10px;
  padding: 5px 8px;
  background: rgba(0, 0, 0, 0.015);
  border: 1px solid transparent;
  transition: all 0.15s;
}
@media (prefers-color-scheme: dark) {
  .task { background: rgba(255, 255, 255, 0.03); }
}
.task.ok {
  background: var(--done-bg);
  border-color: var(--done-border);
}
.task.no {
  background: var(--bad-bg);
  border-color: var(--bad-border);
}

.mark {
  width: 78px;
  height: 28px;
  flex: none;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  border-radius: 9999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  cursor: pointer;
  transition: all 0.15s;
}
.mark:hover {
  border-color: var(--line-strong);
}
.task.ok .mark {
  background: #34c759;
  border-color: #34c759;
  color: #ffffff;
}
.task.no .mark {
  background: #ff3b30;
  border-color: #ff3b30;
  color: #ffffff;
}

.task input.txt {
  flex: 1;
  min-width: 120px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 450;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--fg);
  transition: all 0.15s;
}
.task input.txt:hover {
  border-color: var(--line);
  background: var(--card);
}
.task input.txt:focus {
  border-color: var(--accent);
  background: var(--card);
  box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.15);
  outline: none;
}

.note {
  flex: 1;
  min-width: 110px;
  font: inherit;
  font-size: 12px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.02);
  color: var(--fg);
  transition: all 0.15s;
}
.note:focus {
  border-color: var(--accent);
  background: var(--card);
  box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.15);
  outline: none;
}

.del-btn {
  width: 22px;
  height: 22px;
  line-height: 20px;
  padding: 0;
  text-align: center;
  font-size: 15px;
  color: var(--muted);
  background: rgba(0, 0, 0, 0.04);
  border: none;
  border-radius: 9999px;
  cursor: pointer;
  flex: none;
  transition: all 0.15s;
}
.del-btn:hover {
  color: #ffffff;
  background: #ff3b30;
}

.add-btn {
  width: 100%;
  border: 1px dashed var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--accent);
  font-weight: 600;
  font-size: 12.5px;
  padding: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 2px;
}
.add-btn:hover {
  border-color: var(--accent);
  background: var(--accent-subtle);
}

.task-editor {
  background: var(--claude-bg);
  border: 1px solid var(--claude-border);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 4px 0 8px;
}
.editor-area {
  width: 100%;
  box-sizing: border-box;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  padding: 8px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--card);
  color: var(--fg);
  resize: vertical;
}

pre {
  margin: 0;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12.5px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: all;
  color: var(--fg-secondary);
}

.quiz {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--shadow-card);
  grid-column: 1 / -1;
}
.quiz h2 {
  font-size: 17px;
  margin: 0;
  font-weight: 700;
  line-height: 1.3;
  color: var(--fg);
}
.qgroup {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.01);
}
.qhead {
  font-weight: 700;
  font-size: 14.5px;
  padding: 4px 6px;
  color: var(--fg);
}
.qfold {
  background: var(--done-bg);
  border-color: var(--done-border);
}
.qfold .qhead {
  cursor: pointer;
}
.qrow {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  border-radius: 8px;

    const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = r[1] + " · 完成 " + okn + "/" + currentTasks.length;
    head.append(name, meta);

    const pre = document.createElement("pre"); pre.hidden = true; pre.textContent = text(r);
    const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.id = "copy-" + ri;
    b.textContent = s.c ? "再复制一次" : "复制";
    b.onclick = () => {
      const mark = () => { s.c = new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}); save(); render(); };
      const fail = () => { b.textContent = "请手动选中下方文字复制"; pre.textContent = text(r); pre.hidden = false; };
      try { navigator.clipboard.writeText(text(r)).then(mark, fail); } catch(e) { fail(); }
    };
    head.append(b);
    const all = document.createElement("button"); all.type = "button"; all.className = "small"; all.textContent = "全部✅";
    all.onclick = () => { currentTasks.forEach((_,i) => s.m[i] = "ok"); s.c = ""; save(); render(); };

    const editBtn = document.createElement("button"); editBtn.type = "button"; editBtn.className = "small edit-btn";

      applyBtn.onclick = () => {

        if (!parsed.length) { alert("未能识别出有效任务行，请直接粘贴每行一项任务或带编号的文本。"); return; }
        s.tk = parsed.map(x => x.text);
        s.m = {}; s.n = {};
        parsed.forEach((x, idx) => {
          if (x.mark) s.m[idx] = x.mark;
          if (x.note) s.n[idx] = x.note;
        });
        s.c = ""; openEditors.delete(r[0]); save(); render();
      };
      const resetBtn = document.createElement("button"); resetBtn.type = "button"; resetBtn.className = "small";
      resetBtn.textContent = "恢复默认任务";
      resetBtn.onclick = () => {
        delete s.tk; s.m = {}; s.n = {}; s.c = ""; openEditors.delete(r[0]); save(); render();
      };
      const closeBtn = document.createElement("button"); closeBtn.type = "button"; closeBtn.className = "small";
      closeBtn.textContent = "关闭";
      closeBtn.onclick = () => { openEditors.delete(r[0]); render(); };
      btnRow.append(applyBtn, resetBtn, closeBtn);
      editor.append(tip, ta, btnRow);
      el.append(editor);
    }
    const tasks = document.createElement("div"); tasks.className = "tasks";
    currentTasks.forEach((t, i) => {
      const v = mk(s, t, i);
      const row = document.createElement("div"); row.className = "task " + v;
      const m = document.createElement("button"); m.type = "button"; m.className = "mark"; m.id = "m-" + ri + "-" + i;
      m.textContent = v === "ok" ? "✅ 完成" : v === "no" ? "❌ 未完成" : "未标";
      m.onclick = () => { s.m[i] = !v ? "ok" : v === "ok" ? "no" : ""; s.c = ""; save(); render(); };
      const tx = document.createElement("input"); tx.type = "text"; tx.className = "txt"; tx.id = "tx-" + ri + "-" + i;
      tx.value = t[0];
      tx.title = "点击可直接编辑修改任务";
      tx.onchange = () => {
        if (!Array.isArray(s.tk)) s.tk = currentTasks.map(x => x[0]);
        s.tk[i] = tx.value.trim() || t[0];
        s.c = ""; save(); pre.textContent = text(r); summary(rows);
      };
      const note = document.createElement("input"); note.className = "note"; note.id = "n-" + ri + "-" + i; note.placeholder = "备注（可不填）"; note.value = nt(s, t, i);
      note.oninput = () => { s.n[i] = note.value; if (s.c) { s.c = ""; } save(); pre.textContent = text(r); summary(rows); };
      const del = document.createElement("button"); del.type = "button"; del.className = "del-btn"; del.id = "del-" + ri + "-" + i;
      del.textContent = "×"; del.title = "删除此任务";
      del.onclick = () => {
        if (!Array.isArray(s.tk)) s.tk = currentTasks.map(x => x[0]);
        s.tk.splice(i, 1);
        const newM = {}, newN = {};
        Object.keys(s.m || {}).forEach(k => {
          const idx = Number(k);
          if (idx < i) newM[idx] = s.m[idx];
          else if (idx > i) newM[idx - 1] = s.m[idx];
        });
        Object.keys(s.n || {}).forEach(k => {
          const idx = Number(k);
          if (idx < i) newN[idx] = s.n[idx];
          else if (idx > i) newN[idx - 1] = s.n[idx];
        });
        s.m = newM; s.n = newN; s.c = ""; save(); render();
      };
      row.append(m, tx, note, del); tasks.append(row);
    });
    const opRow = document.createElement("div"); opRow.style.display = "flex"; opRow.style.gap = "8px"; opRow.style.marginTop = "4px"; opRow.style.alignItems = "center"; opRow.style.flexWrap = "wrap";
    const addBtn = document.createElement("button"); addBtn.type = "button"; addBtn.className = "small add-btn";
    addBtn.textContent = "+ 添加一项任务";
    addBtn.onclick = () => {
      if (!Array.isArray(s.tk)) s.tk = currentTasks.map(x => x[0]);
      s.tk.push("新任务");
      s.c = ""; save(); render();
    };
    opRow.append(addBtn);
    if (Array.isArray(s.tk)) {
      const customTag = document.createElement("span"); customTag.className = "sub"; customTag.style.color = "var(--accent)"; customTag.textContent = "(已自定义 " + s.tk.length + " 项任务)";
      opRow.append(customTag);

    tasks.append(opRow);
    el.append(tasks, pre);
    placeCard(el, !!s.c, "done:" + cur + ":" + r[0], (ri+1) + ".【" + r[0] + "】", s.c, bottomD);
  });
  bottomD.forEach(e => list.append(e));
  summary(rows);
}
document.getElementById("reset").onclick = () => { if (mode === "notice") { nc = {}; nsave(); } else if (mode === "quiz") { qz = {}; qsave(); } else if (mode === "plan") { ps = {}; psave(); } else if (mode === "chasing") { ch = {}; chsave(); } else { st = {}; save(); } render(); };

// Manual checks use semantic task keys; array order never identifies a mark.
let checkCloud = null;
const readLocal = (k) => {try{return JSON.parse(localStorage.getItem(k)||'{}')||{};}catch(e){return {};}};
function taskKeys(day, doneOverride) {
  const done = doneOverride || (day === cur ? st : readLocal('wayon-done-' + day));
  const result = [];
  for(const r of DATA[day] || []) {
    const seen = {};
    const d = done[r[0]];
    const tasks = (d && Array.isArray(d.tk) && d.tk.length) ? d.tk.map(x => [x, '', '']) : (r[3] || []);
    tasks.forEach((t, i) => {
      const occurrence = seen[t[0]] || 0; seen[t[0]] = occurrence + 1;
      const classIds = ((DATA._cids || {})[day] || {})[r[0]] || [];
      result.push({name: r[0], i, key: ['task', r[0], r[1], JSON.stringify(classIds.slice().sort()), t[0], occurrence]});
    });
  }
  return result;
}
function captureChecks(day) {
  const done=day===cur ? st : readLocal('wayon-done-'+day);
  const quiz=day===cur && qzDay===cur ? qz : readLocal(qkey(day));
  const plan=day===cur ? ps : readLocal('wayon-plan-'+day);
  const out={};
  for(const {name,i,key:k} of taskKeys(day, done)) {
    const d=done[name];if(!d) continue;
    if(Object.hasOwn(d.m||{},i)) out[JSON.stringify([...k,'mark'])]=d.m[i];
    if(Object.hasOwn(d.n||{},i)) out[JSON.stringify([...k,'note'])]=d.n[i];
  }
  for(const [name,d] of Object.entries(done)) {
    if(d.c) out[JSON.stringify(['done-copy',name])]=d.c;
    if(Array.isArray(d.tk) && d.tk.length) out[JSON.stringify(['student-tasks',name])]=d.tk;
  }
  for(const [name,t] of Object.entries(plan)) if(t) out[JSON.stringify(['plan-copy',name])]=t;
  for(const [name,q] of Object.entries(quiz)) for(const part of ['pre','post'])
    if(q[part]===true) out[JSON.stringify(['quiz',name,part])]=true;
  for(const [name,val] of Object.entries(cstops)) {
    if(val && (Array.isArray(val) ? val.length : (val.stopped_ids && val.stopped_ids.length)))
      out[JSON.stringify(['chasing-stop',name])]=val;
  }
  const nlocal = (DATA._notice_copied || {})[curN] || {};
  for(const [name, when] of Object.entries(Object.assign({}, nlocal, readLocal(nkey(curN))))) if(when) out[JSON.stringify(['notice-copy', curN, name])] = when;
  return out;
}
function applyChecks(day, fields) {
  const done={},quiz={},plan={};
  for(const [raw,value] of Object.entries(fields)) {
    let k;try{k=JSON.parse(raw);}catch(e){continue;}
    if(k[0]==='student-tasks' && Array.isArray(value)) {
      (done[k[1]] ||= {m:{},n:{},c:''}).tk = value;
    }
  }
  const tasks=new Map(taskKeys(day, done).map(x=>[JSON.stringify(x.key),x]));
  for(const [raw,value] of Object.entries(fields)) {
    let k;try{k=JSON.parse(raw);}catch(e){continue;}
    if(k[0]==='task') {
      const part=k.pop(), match=tasks.get(JSON.stringify(k));if(!match)continue;
      const d=done[match.name] ||= {m:{},n:{},c:''};
      if(part==='mark' && ['', 'ok','no'].includes(value))d.m[match.i]=value;
      if(part==='note' && typeof value==='string')d.n[match.i]=value;
    } else if(k[0]==='quiz' && ['pre','post'].includes(k[2]) && value===true) {
      (quiz[k[1]] ||= {pre:false,post:false})[k[2]]=true;
    } else if(k[0]==='plan-copy' && typeof value==='string')plan[k[1]]=value;
    else if(k[0]==='done-copy' && typeof value==='string')(done[k[1]] ||= {m:{},n:{},c:''}).c=value;
    else if(k[0]==='chasing-stop') {
      if(value && (typeof value==='object' || Array.isArray(value))) cstops[k[1]]=value;
      else if(value===null) delete cstops[k[1]];
    } else if(k[0]==='notice-copy' && typeof value==='string') {
      const nDay=k[1], sName=k[2]; const local=readLocal(nkey(nDay)); local[sName]=value; localStorage.setItem(nkey(nDay), JSON.stringify(local)); if(nDay===curN) nc[sName]=value;
    }
  }
  localStorage.setItem(cskey, JSON.stringify(cstops));
  // Retain the legacy device snapshot once; never silently upload old index-based marks.
  const backup='wayon-before-cloud-'+day;
  if(!localStorage.getItem(backup))localStorage.setItem(backup,JSON.stringify({done:readLocal('wayon-done-'+day),quiz:readLocal(qkey(day)),plan:readLocal('wayon-plan-'+day)}));
  localStorage.setItem('wayon-done-'+day,JSON.stringify(done));
  localStorage.setItem(qkey(day),JSON.stringify(quiz));
  localStorage.setItem('wayon-plan-'+day,JSON.stringify(plan));
  if(day===cur) {st=done;ps=plan;qz=quiz;qzDay=day;render();}
}
