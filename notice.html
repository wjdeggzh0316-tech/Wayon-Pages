<script>
const DATE = "2026/10/18";
const ROWS = [["Amy", "09:00-10:30", "【明日课程提醒】2026/10/18⏰\n\n时间： 10月18日 09:00-10:30\n课程： 听力\n老师： 王银屏\n学生： Amy\n形式： 线下\n地点： 大冲商务中心C座1108\n教室： 2号教室"], ["赵梓轩", "10:40-12:40", "【明日课程提醒】2026/10/18⏰\n\n时间： 10月18日 10:40-12:40\n课程： 阅读写作\n老师： 徐梓淞\n学生： 赵梓轩\n形式： 线下\n地点： 大冲商务中心C座1108\n教室： 3号教室"], ["朱宸萱", "13:30-15:30", "【明日课程提醒】2026/10/18⏰\n\n时间： 10月18日 13:30-15:30\n课程： 阅读\n老师： 徐梓淞\n学生： 朱宸萱\n形式： 线上"], ["代佳鸣", "14:00-15:30", "【明日课程提醒】2026/10/18⏰\n\n时间： 10月18日 14:00-15:30\n课程： 词汇与语言应用\n老师： 王银屏\n学生： 代佳鸣\n形式： 线下\n地点： 大冲商务中心C座1108\n教室： 2号教室"], ["李洪睿John", "15:00-17:00", "【明日课程提醒】2026/10/18⏰\n\n时间： 10月18日 15:00-17:00\n课程： 语法\n老师： 任玥蓉\n学生： 李洪睿John\n形式： 线下\n地点： 大冲商务中心C座1108\n教室： 1号教室"], ["王明泽&李子熙", "15:40-17:40", "【明日课程提醒】2026/10/18⏰\n\n时间： 10月18日 15:40-17:40\n课程： SAT阅读\n老师： 元园\n学生： 王明泽/李子熙\n形式： 线下\n地点： 大冲商务中心C座1108\n教室： 5号教室"]]; // [卡片名, 上课时间, 通知全文]
const KEY = "wayon-copied-" + DATE;
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} push(); };
const list = document.getElementById("list");
document.getElementById("d").textContent = DATE;
function render(){
  list.textContent = "";
  let n = 0;
  ROWS.forEach((r, i) => {
    const done = st[r[0]]; if (done) n++;
    const el = document.createElement("div"); el.className = "item" + (done ? " done" : "");
    const head = document.createElement("div"); head.className = "head";
    const name = document.createElement("div"); name.className = "name"; name.textContent = (i+1) + ".【" + r[0] + "】";
    const time = document.createElement("div"); time.className = "time"; time.textContent = r[1];
    head.append(name, time);
    if (done){ const s = document.createElement("div"); s.className = "state"; s.textContent = "✓ 已复制 " + done; head.append(s); }
    const pre = document.createElement("pre"); pre.textContent = r[2];
    const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.id = "copy-" + i;
    b.textContent = done ? "再复制一次" : "复制";
    b.onclick = () => {
      const mark = () => { st[r[0]] = new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}); save(); render(); };
      const sel = () => { const g = getSelection(), rg = document.createRange(); rg.selectNodeContents(pre); g.removeAllRanges(); g.addRange(rg); b.textContent = "已选中，按 ⌘C 复制"; };
      try { navigator.clipboard.writeText(r[2]).then(mark, sel); } catch(e) { sel(); }
    };
    head.append(b);
    if (done){ const u = document.createElement("button"); u.type = "button"; u.className = "undo"; u.textContent = "撤销"; u.onclick = () => { delete st[r[0]]; save(); render(); }; head.append(u); }
    el.append(head, pre); list.append(el);
  });
  document.getElementById("count").textContent = n + " / " + ROWS.length + " 已复制";
  document.getElementById("fill").style.width = (ROWS.length ? n / ROWS.length * 100 : 0) + "%";
}
document.getElementById("reset").onclick = () => { st = {}; save(); render(); };
render();
// 云端同步（2026-10-05）：在 claude.ai 打开时「已复制」存到 artifact 数据库（集合 wayon_notice，文档 = 日期），多设备同一份。
let DB = null, wq = Promise.resolve(), wt = 0;
const DOC = "wayon_notice/" + DATE.split("/").join("-");
const syncEl = document.getElementById("sync");
const setSync = t => { syncEl.textContent = t; };
setSync("「已复制」状态只保存在这台设备的浏览器里。");
function push(){
  if (!DB) return;
  const body = {copied: JSON.stringify(st), at: new Date().toISOString()};
  clearTimeout(wt);
  wt = setTimeout(() => {
    wq = wq.then(() => DB.doc(DOC).set(body))
      .then(() => setSync("☁️ 已同步到云端：手机、电脑打开都是同一份。"),
            e => setSync("⚠️ 云端保存失败（" + ((e && e.code) || "unknown") + "），这台设备上已保存。"));
  }, 300);
}
if (typeof claude !== "undefined" && claude && claude.use) {
  claude.use("db").then(db => {
    if (!db) return;
    DB = db; setSync("☁️ 云端同步已开启：手机、电脑打开都是同一份。");
    DB.doc(DOC).onSnapshot(snap => {
      if (!snap.exists) { if (Object.keys(st).length) push(); return; }
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      let ns = {}; try { ns = JSON.parse((snap.data() || {}).copied || "{}") || {}; } catch(e) {}
      if (JSON.stringify(ns) === JSON.stringify(st)) return;
      st = ns; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {}
      render();
    }, e => setSync("⚠️ 云端同步中断（" + ((e && e.code) || "unknown") + "），刷新页面可重连。"));
  }, () => {});
}
</script>
