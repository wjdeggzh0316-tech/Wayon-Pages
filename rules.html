<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wayon · 任务规则</title>
  <style>
    body {
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
      font: 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-link {
      font-size: 20px;
      font-weight: 700;
      color: #1d1d1f;
      text-decoration: none;
      letter-spacing: -0.03em;
    }
    .back-link {
      font-size: 13px;
      color: #0071e3;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 20px auto;
      padding: 0 16px 40px;
      box-sizing: border-box;
    }
    #rules-standalone-root {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      min-height: 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="./" class="brand-link">Wayon</a>
    <a href="./" class="back-link">← 返回教学工作台</a>
  </header>
  <main>
    <div id="rules-standalone-root">
      <div style="padding:48px 20px;text-align:center;color:#666">
        <p style="font-size:15px;margin:0 0 8px">正在连接统一规则库…</p>
      </div>
    </div>
  </main>
  <script type="module">
    import { mountRules } from './rules-editor.mjs?v=20261026-studio3';
    let sdk;
    try {
      sdk = await import('https://esm.sh/@supabase/supabase-js@2.49.4');
    } catch {
      try {
        sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm');
      } catch {
        sdk = await import('https://unpkg.com/@supabase/supabase-js@2.49.4/dist/module/index.js');
      }
    }
    const config = await (await fetch('./checks-public-config.json', { cache: 'no-store' })).json();
    const client = sdk.createClient(config.url, config.key);
    await mountRules({
      document,
      client,
      container: document.getElementById('rules-standalone-root'),
      onClose: () => { window.location.href = './'; }
    });
  </script>
</body>
</html>
