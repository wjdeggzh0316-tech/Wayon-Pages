<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wayon · 任务规则</title>
<style>body{margin:0;background:#f5f5f7;color:#1d1d1f;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{background:white;padding:24px 6vw;border-radius:0 0 24px 24px}h1{font-size:clamp(70px,13vw,150px);letter-spacing:-.06em;margin:0;line-height:1}main{max-width:1000px;margin:28px auto;padding:0 20px 50px}a{color:#007aff}details,form{background:white;border:1px solid #e5e5e7;border-radius:18px;padding:18px;margin:12px 0}summary{font-weight:600;cursor:pointer}label{display:block;color:#555;font-size:14px;margin:14px 0}input,select,textarea,button{font:inherit;box-sizing:border-box;border:1px solid #ddd;border-radius:9px;padding:10px;background:#fff;color:#1d1d1f}input,select,textarea{display:block;width:100%;margin-top:6px}textarea{min-height:88px;resize:vertical}fieldset{display:flex;flex-wrap:wrap;gap:12px;border:0;padding:0}fieldset label{display:flex;gap:6px;align-items:center}input[type=checkbox]{width:auto;margin:0}button{cursor:pointer}#save{background:#007aff;color:white;border:0}#actions{position:sticky;top:0;background:#f5f5f7eF;padding:12px 0;z-index:2}#status{line-height:1.6}.override{padding:15px 0;border-bottom:1px solid #eee}button:disabled{opacity:.5}#actions button{margin-right:8px}</style>
<header><h1>Wayon</h1></header><main><a href="./">← 返回工作台</a><h2>任务规则</h2><p>这里的频率、任务内容和特殊规则与自动布置共用。修改已保存的规则，不会立即发作业；下次例行会按新规则核验后执行。特殊阅读请使用下方选项；未支持的自然语言要求会列入报告，请老师确认。</p><p id="status" role="status">正在读取…</p><form id="login" hidden><label>工作台邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><div id="actions" hidden><button id="save">保存规则</button><button id="reload">重新读取</button></div><div id="rules"></div></main>
<script type="module">import{mountRules}from'./rules-editor.mjs';let sdk;try{sdk=await import('https://esm.sh/@supabase/supabase-js@2.49.4')}catch{sdk=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm')}const config=await(await fetch('./checks-public-config.json',{cache:'no-store'})).json();await mountRules({document,client:sdk.createClient(config.url,config.key)});</script></html>
