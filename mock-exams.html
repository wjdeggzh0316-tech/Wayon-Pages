<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>维安教育 · 入学模考</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png">
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var isEmbed = params.get('embed') === '1';
        if (!isEmbed) {
          try { isEmbed = window.self !== window.top; } catch (_) { isEmbed = true; }
        }
        if (isEmbed) document.documentElement.setAttribute('data-embed', '1');
        var theme = params.get('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;

      --bg-light: #f5f5f7;
      --card-light: #ffffff;
      --fg-light: #1d1d1f;
      --fg-secondary-light: #515156;
      --muted-light: #6e6e73;
      --line-light: rgba(30, 30, 40, .09);
      --line-strong-light: rgba(30, 30, 40, .16);
      --accent-light: #0071e3;
      --accent-hover-light: #005ec0;
      --accent-fg-light: #ffffff;
      --accent-subtle-light: #eaf3ff;
      --accent-badge-fg-light: #0057b8;
      --done-light: #248a3d;
      --done-fg-light: #ffffff;
      --done-subtle-light: #e7f6ec;
      --warn-fg-light: #9a5b00;
      --warn-subtle-light: #fff4e0;
      --code-bg-light: #f0f1f4;
      --chip-bg-light: #f4f5f7;
      --chip-fg-light: #424247;
      --violet-bg-light: #f2edff;
      --violet-fg-light: #5b21b6;
      --teal-bg-light: #e6f5ee;
      --teal-fg-light: #146c43;
      --header-bg-light: rgba(255, 255, 255, .88);
      --sticky-bg-light: rgba(245, 245, 247, .92);
      --shadow-card-light: 0 2px 12px rgba(20, 20, 35, .035), 0 0 0 1px rgba(30, 30, 40, .055);
      --shadow-card-hover-light: 0 8px 24px rgba(20, 20, 35, .075), 0 0 0 1px rgba(0, 113, 227, .22);
      --shadow-toast-light: 0 12px 32px rgba(15, 20, 35, .16);
      --scrollbar-thumb-light: rgba(60, 60, 70, .28);
      --scrollbar-track-light: transparent;

      --bg-dark: #151517;
      --card-dark: #222225;
      --fg-dark: #f5f5f7;
      --fg-secondary-dark: #c9c9d1;
      --muted-dark: #a0a0a8;
      --line-dark: rgba(255, 255, 255, .1);
      --line-strong-dark: rgba(255, 255, 255, .18);
      --accent-dark: #64b0ff;
      --accent-hover-dark: #85c2ff;
      --accent-fg-dark: #07192b;
      --accent-subtle-dark: #21364d;
      --accent-badge-fg-dark: #93c8ff;
      --done-dark: #34c759;
      --done-fg-dark: #062110;
      --done-subtle-dark: #163322;
      --warn-fg-dark: #ffd166;
      --warn-subtle-dark: #3a2d10;
      --code-bg-dark: #2b2b30;
      --chip-bg-dark: #2c2c31;
      --chip-fg-dark: #d1d1d8;
      --violet-bg-dark: #2c2142;
      --violet-fg-dark: #cbb7ff;
      --teal-bg-dark: #173327;
      --teal-fg-dark: #7de3b2;
      --header-bg-dark: rgba(34, 34, 37, .9);
      --sticky-bg-dark: rgba(21, 21, 23, .92);
      --shadow-card-dark: 0 2px 12px rgba(0, 0, 0, .26), 0 0 0 1px rgba(255, 255, 255, .07);
      --shadow-card-hover-dark: 0 8px 24px rgba(0, 0, 0, .42), 0 0 0 1px rgba(100, 176, 255, .34);
      --shadow-toast-dark: 0 12px 32px rgba(0, 0, 0, .52);
      --scrollbar-thumb-dark: rgba(220, 220, 235, .28);
      --scrollbar-track-dark: transparent;

      /* Active semantic tokens (fallback before light-dark() @supports) */
      --bg: var(--bg-light);
      --card: var(--card-light);
      --fg: var(--fg-light);
      --fg-secondary: var(--fg-secondary-light);
      --muted: var(--muted-light);
      --line: var(--line-light);
      --line-strong: var(--line-strong-light);
      --accent: var(--accent-light);
      --accent-hover: var(--accent-hover-light);
      --accent-fg: var(--accent-fg-light);
      --accent-subtle: var(--accent-subtle-light);
      --accent-badge-fg: var(--accent-badge-fg-light);
      --done: var(--done-light);
      --done-fg: var(--done-fg-light);
      --done-subtle: var(--done-subtle-light);
      --warn-fg: var(--warn-fg-light);
      --warn-subtle: var(--warn-subtle-light);
      --code-bg: var(--code-bg-light);
      --chip-bg: var(--chip-bg-light);
      --chip-fg: var(--chip-fg-light);
      --violet-bg: var(--violet-bg-light);
      --violet-fg: var(--violet-fg-light);
      --teal-bg: var(--teal-bg-light);
      --teal-fg: var(--teal-fg-light);
      --header-bg: var(--header-bg-light);
      --sticky-bg: var(--sticky-bg-light);
      --shadow-card: var(--shadow-card-light);
      --shadow-card-hover: var(--shadow-card-hover-light);
      --shadow-toast: var(--shadow-toast-light);
      --scrollbar-thumb: var(--scrollbar-thumb-light);
      --scrollbar-track: var(--scrollbar-track-light);

      --radius-card: 16px;
      --radius-ctrl: 10px;
      --target-size: 36px;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

      accent-color: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: var(--bg-dark);
        --card: var(--card-dark);
        --fg: var(--fg-dark);
        --fg-secondary: var(--fg-secondary-dark);
        --muted: var(--muted-dark);
        --line: var(--line-dark);
        --line-strong: var(--line-strong-dark);
        --accent: var(--accent-dark);
        --accent-hover: var(--accent-hover-dark);
        --accent-fg: var(--accent-fg-dark);
        --accent-subtle: var(--accent-subtle-dark);
        --accent-badge-fg: var(--accent-badge-fg-dark);
        --done: var(--done-dark);
        --done-fg: var(--done-fg-dark);
        --done-subtle: var(--done-subtle-dark);
        --warn-fg: var(--warn-fg-dark);
        --warn-subtle: var(--warn-subtle-dark);
        --code-bg: var(--code-bg-dark);
        --chip-bg: var(--chip-bg-dark);
        --chip-fg: var(--chip-fg-dark);
        --violet-bg: var(--violet-bg-dark);
        --violet-fg: var(--violet-fg-dark);
        --teal-bg: var(--teal-bg-dark);
        --teal-fg: var(--teal-fg-dark);
        --header-bg: var(--header-bg-dark);
        --sticky-bg: var(--sticky-bg-dark);
        --shadow-card: var(--shadow-card-dark);
        --shadow-card-hover: var(--shadow-card-hover-dark);
        --shadow-toast: var(--shadow-toast-dark);
        --scrollbar-thumb: var(--scrollbar-thumb-dark);
        --scrollbar-track: var(--scrollbar-track-dark);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: var(--bg-dark);
      --card: var(--card-dark);
      --fg: var(--fg-dark);
      --fg-secondary: var(--fg-secondary-dark);
      --muted: var(--muted-dark);
      --line: var(--line-dark);
      --line-strong: var(--line-strong-dark);
      --accent: var(--accent-dark);
      --accent-hover: var(--accent-hover-dark);
      --accent-fg: var(--accent-fg-dark);
      --accent-subtle: var(--accent-subtle-dark);
      --accent-badge-fg: var(--accent-badge-fg-dark);
      --done: var(--done-dark);
      --done-fg: var(--done-fg-dark);
      --done-subtle: var(--done-subtle-dark);
      --warn-fg: var(--warn-fg-dark);
      --warn-subtle: var(--warn-subtle-dark);
      --code-bg: var(--code-bg-dark);
      --chip-bg: var(--chip-bg-dark);
      --chip-fg: var(--chip-fg-dark);
      --violet-bg: var(--violet-bg-dark);
      --violet-fg: var(--violet-fg-dark);
      --teal-bg: var(--teal-bg-dark);
      --teal-fg: var(--teal-fg-dark);
      --header-bg: var(--header-bg-dark);
      --sticky-bg: var(--sticky-bg-dark);
      --shadow-card: var(--shadow-card-dark);
      --shadow-card-hover: var(--shadow-card-hover-dark);
      --shadow-toast: var(--shadow-toast-dark);
      --scrollbar-thumb: var(--scrollbar-thumb-dark);
      --scrollbar-track: var(--scrollbar-track-dark);
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --card: light-dark(var(--card-light), var(--card-dark));
        --fg: light-dark(var(--fg-light), var(--fg-dark));
        --fg-secondary: light-dark(var(--fg-secondary-light), var(--fg-secondary-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --line: light-dark(var(--line-light), var(--line-dark));
        --line-strong: light-dark(var(--line-strong-light), var(--line-strong-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
        --accent-hover: light-dark(var(--accent-hover-light), var(--accent-hover-dark));
        --accent-fg: light-dark(var(--accent-fg-light), var(--accent-fg-dark));
        --accent-subtle: light-dark(var(--accent-subtle-light), var(--accent-subtle-dark));
        --accent-badge-fg: light-dark(var(--accent-badge-fg-light), var(--accent-badge-fg-dark));
        --done: light-dark(var(--done-light), var(--done-dark));
        --done-fg: light-dark(var(--done-fg-light), var(--done-fg-dark));
        --done-subtle: light-dark(var(--done-subtle-light), var(--done-subtle-dark));
        --warn-fg: light-dark(var(--warn-fg-light), var(--warn-fg-dark));
        --warn-subtle: light-dark(var(--warn-subtle-light), var(--warn-subtle-dark));
        --code-bg: light-dark(var(--code-bg-light), var(--code-bg-dark));
        --chip-bg: light-dark(var(--chip-bg-light), var(--chip-bg-dark));
        --chip-fg: light-dark(var(--chip-fg-light), var(--chip-fg-dark));
        --violet-bg: light-dark(var(--violet-bg-light), var(--violet-bg-dark));
        --violet-fg: light-dark(var(--violet-fg-light), var(--violet-fg-dark));
        --teal-bg: light-dark(var(--teal-bg-light), var(--teal-bg-dark));
        --teal-fg: light-dark(var(--teal-fg-light), var(--teal-fg-dark));
        --header-bg: light-dark(var(--header-bg-light), var(--header-bg-dark));
        --sticky-bg: light-dark(var(--sticky-bg-light), var(--sticky-bg-dark));
        --scrollbar-thumb: light-dark(var(--scrollbar-thumb-light), var(--scrollbar-thumb-dark));
        --scrollbar-track: light-dark(var(--scrollbar-track-light), var(--scrollbar-track-dark));
      }
    }

    @media (pointer: coarse) {
      :root {
        --target-size: 44px;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: calc(1rem + env(safe-area-inset-top, 0px));
      scroll-padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-block-size: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      min-block-size: 100dvh;
      inline-size: 100%;
      min-inline-size: 0;
    }

    h1, h2, h3 {
      text-wrap: balance;
      margin: 0;
    }

    p {
      text-wrap: pretty;
      margin: 0;
    }

    :where(a, code) {
      overflow-wrap: anywhere;
    }

    :where(a:any-link, button, input, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    .skip-link:focus-visible {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      padding: 10px 16px;
      border-radius: var(--radius-ctrl);
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
      text-decoration: none;
    }

    /* Standalone Header */
    .site-header {
      background: var(--header-bg);
      backdrop-filter: saturate(160%) blur(14px);
      -webkit-backdrop-filter: saturate(160%) blur(14px);
      border-bottom: 1px solid var(--line);
      padding-top: max(18px, env(safe-area-inset-top, 0px));
      padding-bottom: 18px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .header-inner {
      max-inline-size: 1680px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px 24px;
      flex-wrap: wrap;
    }

    .hero-brand {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-inline-size: 0;
      flex: 1 1 320px;
    }

    .brand-mark {
      flex: 0 0 auto;
      inline-size: 40px;
      block-size: 40px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-fg);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(0, 113, 227, .24);
      margin-top: 2px;
    }

    .brand-mark svg {
      inline-size: 22px;
      block-size: 22px;
    }

    .hero-copy {
      min-inline-size: 0;
    }

    .hero-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-title {
      font-size: clamp(1.25rem, 2.2vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.25;
      color: var(--fg);
    }

    .hero-count-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-subtle);
      color: var(--accent-badge-fg);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .hero-subtitle {
      margin-top: 4px;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Embed mode overrides */
    html[data-embed="1"] {
      background: transparent;
      overflow: hidden;
      overflow: clip;
      scroll-padding-top: 0;
      scroll-padding-bottom: 0;
    }

    html[data-embed="1"] body {
      min-block-size: 0;
      block-size: auto;
      display: block;
      background: transparent;
    }

    html[data-embed="1"] .page {
      display: flow-root;
      min-block-size: 0;
      block-size: auto;
    }

    html[data-embed="1"] .site-header {
      position: relative;
      block-size: 0;
      padding: 0;
      border: 0;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      overflow: hidden;
      overflow: clip;
    }

    html[data-embed="1"] .hero-actions,
    html[data-embed="1"] .brand-mark,
    html[data-embed="1"] .hero-count-pill,
    html[data-embed="1"] .hero-subtitle {
      display: none;
    }

    html[data-embed="1"] .hero-brand {
      position: absolute;
      clip-path: inset(50%);
      overflow: hidden;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      white-space: nowrap;
    }

    html[data-embed="1"] .page-shell {
      flex: none;
      max-inline-size: none;
      margin-inline: 0;
      padding-block: 4px 14px;
      padding-inline: 6px;
    }

    html[data-embed="1"] .controls-panel {
      gap: 8px;
      margin-bottom: 12px;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--line);
    }

    html[data-embed="1"] .filter-rows {
      gap: 6px;
    }

    html[data-embed="1"] .search-input,
    html[data-embed="1"] .inviter-input {
      min-block-size: max(38px, var(--target-size));
    }

    html[data-embed="1"] .pill {
      min-block-size: max(32px, var(--target-size));
      padding: 0 11px;
      font-size: 13px;
    }

    @media (pointer: fine) and (min-width: 600px) {
      html[data-embed="1"] .pill {
        min-block-size: 32px;
      }
    }

    html[data-embed="1"] .status-row {
      padding-top: 0;
      font-size: 12.5px;
    }

    html[data-embed="1"] .exam-grid {
      gap: 12px;
    }

    html[data-embed="1"] .exam-card {
      padding: 15px 16px;
      gap: 11px;
    }

    html[data-embed="1"] .card-head {
      gap: 8px;
    }

    html[data-embed="1"] .card-actions {
      padding-top: 10px;
    }

    html[data-embed="1"] .site-footer {
      margin-top: 0;
      padding-block: 10px 14px;
      padding-inline: 6px;
    }

    html[data-embed="1"] .embed-only-actions {
      display: flex;
    }

    .embed-only-actions {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn-primary,
    .btn-secondary,
    .btn-outline,
    .btn-ghost,
    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-block-size: var(--target-size);
      padding: 0 14px;
      border-radius: var(--radius-ctrl);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 120ms ease;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active,
    .btn-secondary:active,
    .btn-outline:active {
      transform: scale(0.985);
    }

    .btn-primary.is-copied,
    .btn-secondary.is-copied,
    .btn-outline.is-copied {
      background: var(--done);
      border-color: var(--done);
      color: var(--done-fg);
    }

    .btn-secondary {
      background: var(--code-bg);
      color: var(--fg);
      border-color: var(--line);
    }

    .btn-secondary:hover {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent-badge-fg);
    }

    .btn-outline {
      background: var(--card);
      color: var(--fg);
      border-color: var(--line-strong);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent-badge-fg);
      background: var(--accent-subtle);
    }

    .btn-ghost,
    .btn-link {
      background: transparent;
      color: var(--accent-badge-fg);
      padding: 0 10px;
      font-weight: 550;
    }

    .btn-ghost:hover,
    .btn-link:hover {
      background: var(--accent-subtle);
    }

    .btn-outline[aria-busy="true"] {
      opacity: .78;
      cursor: progress;
    }

    .icon-svg {
      inline-size: 15px;
      block-size: 15px;
      flex: 0 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .is-spinning .icon-spin {
      animation: spin 800ms linear infinite;
    }

    /* Main Container */
    .page-shell {
      flex: 1 0 auto;
      inline-size: 100%;
      min-inline-size: 0;
      max-inline-size: 1680px;
      margin-inline: auto;
      padding-top: 18px;
      padding-bottom: max(36px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    /* Controls Bar */
    .controls-panel {
      display: flex;
      flex-direction: column;
      min-inline-size: 0;
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (min-width: 768px) and (min-height: 700px) {
      html:not([data-embed="1"]) {
        scroll-padding-top: 190px;
      }

      html:not([data-embed="1"]) .controls-panel {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 12px 0 10px;
        margin-top: -12px;
        background: var(--sticky-bg);
        backdrop-filter: saturate(160%) blur(14px);
        -webkit-backdrop-filter: saturate(160%) blur(14px);
        border-bottom: 1px solid var(--line);
      }
    }

    .utility-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-field {
      position: relative;
      flex: 1 1 280px;
      min-inline-size: 0;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      inline-size: 16px;
      block-size: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      inline-size: 100%;
      min-block-size: max(40px, var(--target-size));
      padding: 8px 38px 8px 36px;
      border-radius: var(--radius-ctrl);
      border: 1px solid var(--line-strong);
      background: var(--card);
      color: var(--fg);
      font-family: inherit;
      font-size: 15px;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
      outline: none;
    }

    .search-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .inviter-field {
      position: relative;
      flex: 0 1 240px;
      min-inline-size: 180px;
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-ctrl);
      padding-left: 11px;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .inviter-field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    .inviter-label {
      flex: 0 0 auto;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      margin-right: 6px;
      white-space: nowrap;
      user-select: none;
    }

    .inviter-input {
      flex: 1 1 auto;
      min-inline-size: 0;
      min-block-size: max(38px, var(--target-size));
      border: 0;
      background: transparent;
      color: var(--fg);
      font-family: inherit;
      font-size: 14.5px;
      padding: 6px 34px 6px 2px;
      outline: none;
    }

    .inviter-input:focus-visible {
      outline: none;
    }

    .input-clear {
      position: absolute;
      right: 4px;
      inline-size: 32px;
      block-size: 32px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .input-clear:hover {
      background: var(--code-bg);
      color: var(--fg);
    }

    .input-clear[hidden] {
      display: none;
    }

    /* Two-level filter bars */
    .filter-rows {
      display: flex;
      flex-direction: column;
      min-inline-size: 0;
      max-inline-size: 100%;
      gap: 8px;
    }

    .group-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-strip-nav {
      min-inline-size: 0;
      max-inline-size: 100%;
    }

    .cat-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      max-inline-size: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-padding-inline: 12px;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 6px;
      margin: -2px -2px -6px;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    @supports not (scrollbar-color: auto) {
      .cat-strip {
        scrollbar-width: auto;
      }
      .cat-strip::-webkit-scrollbar {
        height: 6px;
      }
      .cat-strip::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 999px;
      }
      .cat-strip::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
    }

    .pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-block-size: max(34px, var(--target-size));
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--card);
      color: var(--fg-secondary);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 550;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease;
    }

    .pill:hover {
      border-color: var(--accent);
      color: var(--fg);
    }

    .pill-group {
      background: var(--code-bg);
      border-color: transparent;
    }

    .pill-group[aria-pressed="true"] {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--card);
    }

    .pill-cat[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-fg);
    }

    .pill-count {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      opacity: .76;
    }

    .pill[aria-pressed="true"] .pill-count {
      opacity: .9;
    }

    /* Status summary row */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
      padding-top: 2px;
    }

    .status-left,
    .status-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .result-count {
      font-variant-numeric: tabular-nums;
      color: var(--fg-secondary);
      font-weight: 550;
    }

    .reset-link {
      border: 0;
      background: transparent;
      color: var(--accent-badge-fg);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      min-block-size: 32px;
      cursor: pointer;
    }

    .reset-link:hover {
      background: var(--accent-subtle);
    }

    .reset-link[hidden] {
      display: none;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--code-bg);
      color: var(--fg-secondary);
      font-size: 12px;
      font-weight: 550;
      font-variant-numeric: tabular-nums;
    }

    .status-chip[hidden] {
      display: none;
    }

    .status-chip[data-tone="ok"] {
      background: var(--done-subtle);
      color: var(--done);
    }

    .status-chip[data-tone="warn"] {
      background: var(--warn-subtle);
      color: var(--warn-fg);
    }

    .status-dot {
      inline-size: 7px;
      block-size: 7px;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 auto;
    }

    /* Exam Card Grid */
    .exam-grid {
      inline-size: 100%;
      min-inline-size: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .exam-card {
      container-type: inline-size;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 18px;
      border-radius: var(--radius-card);
      background: var(--card);
      box-shadow: var(--shadow-card);
      transition: box-shadow 160ms ease, transform 160ms ease;
    }

    .exam-card:hover {
      box-shadow: var(--shadow-card-hover);
    }

    .card-head {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.01em;
      background: var(--accent-subtle);
      color: var(--accent-badge-fg);
    }

    .cat-badge[data-group="升学类"] {
      background: var(--violet-bg);
      color: var(--violet-fg);
    }

    .cat-badge[data-group="能力测试"] {
      background: var(--teal-bg);
      color: var(--teal-fg);
    }

    .time-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
      font-weight: 550;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .card-title {
      font-size: 16.5px;
      font-weight: 650;
      line-height: 1.38;
      letter-spacing: -0.015em;
      color: var(--fg);
    }

    .struct-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }

    .struct-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 7px;
      background: var(--chip-bg);
      color: var(--chip-fg);
      font-size: 12.5px;
      line-height: 1.35;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .card-actions .btn-primary {
      flex: 1 1 108px;
    }

    .card-actions .btn-secondary {
      flex: 1 1 92px;
    }

    .card-actions .btn-link {
      flex: 0 0 auto;
    }

    @container (inline-size < 330px) {
      .card-actions {
        gap: 6px;
      }
      .card-actions .btn-primary,
      .card-actions .btn-secondary {
        padding: 0 8px;
        gap: 4px;
        font-size: 12.5px;
      }
      .card-actions .btn-link {
        padding: 0 5px;
        font-size: 12.5px;
      }
    }

    @container (inline-size < 260px) {
      .card-actions .btn-primary {
        flex-basis: 100%;
      }
      .card-actions .btn-secondary {
        flex: 1 1 110px;
      }
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      padding: 44px 20px;
      border-radius: var(--radius-card);
      background: var(--card);
      border: 1px dashed var(--line-strong);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 650;
      color: var(--fg);
    }

    .empty-desc {
      font-size: 13.5px;
      color: var(--muted);
    }

    /* Footer */
    .site-footer {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .footer-inner {
      max-inline-size: 1680px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px 20px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--muted);
    }

    html[data-embed="1"] .footer-inner {
      max-inline-size: none;
      margin-inline: 0;
    }

    .footer-link {
      color: var(--accent-badge-fg);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      min-block-size: 32px;
      padding: 0 4px;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    /* Toast Region & Popover Toasts */
    .toast-region {
      position: fixed;
      inset-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px));
      inset-block-end: max(18px, env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toast-item {
      display: none;
      pointer-events: auto;
      position: fixed;
      inset: auto auto max(18px, env(safe-area-inset-bottom, 0px)) 50%;
      margin: 0;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 8px 12px 8px 16px;
      background: var(--card);
      color: var(--fg);
      box-shadow: var(--shadow-toast);
      max-inline-size: min(520px, calc(100vw - 24px));
      font-size: 13.5px;
      font-weight: 550;
      line-height: 1.4;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: opacity 180ms ease, transform 180ms ease, display 180ms ease, overlay 180ms ease;
      transition-behavior: allow-discrete;
    }

    .toast-item.is-open {
      display: inline-flex;
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast-item[popover]:popover-open {
      display: inline-flex;
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @starting-style {
      .toast-item[popover]:popover-open {
        opacity: 0;
        transform: translate(-50%, 10px);
      }
    }

    .toast-item[data-tone="ok"] {
      border-color: var(--done);
    }

    .toast-item[data-tone="warn"] {
      border-color: var(--warn-fg);
    }

    .toast-dot {
      inline-size: 8px;
      block-size: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--accent);
    }

    .toast-item[data-tone="ok"] .toast-dot {
      background: var(--done);
    }

    .toast-item[data-tone="warn"] .toast-dot {
      background: var(--warn-fg);
    }

    .toast-close {
      flex: 0 0 auto;
      min-inline-size: 28px;
      min-block-size: 28px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .toast-close:hover {
      background: var(--code-bg);
      color: var(--fg);
    }

    /* Native Modal Dialog for Clipboard Fallback */
    dialog.copy-dialog {
      margin: auto;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      background: var(--card);
      color: var(--fg);
      inline-size: min(520px, calc(100vw - 28px));
      max-block-size: calc(100dvh - 32px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, .28);
    }

    dialog.copy-dialog[open] {
      display: flex;
      flex-direction: column;
    }

    dialog.copy-dialog:modal {
      overscroll-behavior: contain;
    }

    dialog.copy-dialog::backdrop {
      background: rgba(15, 18, 25, .48);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .dialog-close {
      min-inline-size: 36px;
      min-block-size: 36px;
      border-radius: 999px;
      border: 0;
      background: var(--code-bg);
      color: var(--fg-secondary);
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .dialog-close:hover {
      background: var(--line-strong);
      color: var(--fg);
    }

    .dialog-body {
      padding: 14px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .dialog-hint {
      font-size: 13.5px;
      color: var(--muted);
    }

    .dialog-textarea {
      inline-size: 100%;
      min-block-size: 140px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: var(--code-bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.55;
      resize: vertical;
    }

    .dialog-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0;
    }

    /* Mobile refinements <= 599px */
    @media (max-width: 599px) {
      :root {
        --target-size: 44px;
      }

      .site-header {
        padding-top: max(14px, env(safe-area-inset-top, 0px));
        padding-bottom: 14px;
      }

      .hero-actions {
        inline-size: 100%;
      }

      .hero-actions > .btn-outline {
        flex: 1 1 auto;
      }

      .search-input,
      .inviter-input,
      .dialog-textarea {
        font-size: 16px;
      }

      .inviter-field {
        flex: 1 1 100%;
        min-inline-size: 0;
      }

      .embed-only-actions {
        inline-size: 100%;
      }

      .embed-only-actions > .btn-outline {
        flex: 1 1 auto;
      }

      .exam-card {
        padding: 16px;
      }

      .input-clear {
        inline-size: 40px;
        block-size: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

      function getParentTargetOrigin() {
        try {
          if (window.location && window.location.origin && window.location.origin !== 'null') {
            return window.location.origin;
          }
        } catch (_) {}
        return '*';
      }

      function measureEmbedHeight() {
        if (!pageRoot) return 0;
        const rectHeight = typeof pageRoot.getBoundingClientRect === 'function'
          ? pageRoot.getBoundingClientRect().height
          : 0;
        const scrollHeight = pageRoot.scrollHeight || 0;
        const offsetHeight = pageRoot.offsetHeight || 0;
        return Math.ceil(Math.max(rectHeight, scrollHeight, offsetHeight));
      }

      function postEmbedHeight(force) {
        if (!isEmbedMode || !window.parent || window.parent === window) return;
        const height = measureEmbedHeight();
        if (!Number.isFinite(height) || height <= 0) return;
        if (!force && height === lastReportedHeight) return;
        lastReportedHeight = height;
        try {
          window.parent.postMessage(
            { type: 'wayon-mocks-height', height: height },
            getParentTargetOrigin()
          );
        } catch (_) {}
      }

      function scheduleEmbedHeightReport(force) {
        if (!isEmbedMode) return;
        if (force) {
          if (embedHeightRaf && typeof window.cancelAnimationFrame === 'function') {
            window.cancelAnimationFrame(embedHeightRaf);
            embedHeightRaf = 0;
          }
          postEmbedHeight(true);
          return;
        }
        if (embedHeightRaf) return;
        if (typeof window.requestAnimationFrame === 'function') {
          let ran = false;
          const rafId = window.requestAnimationFrame(() => {
            ran = true;
            embedHeightRaf = 0;
            postEmbedHeight(false);
          });
          if (!ran) embedHeightRaf = rafId;
        } else {
          postEmbedHeight(false);
        }
      }

      function getEmbedVisibleViewportBand() {
        if (!isEmbedMode) return null;
        try {
          const frameEl = window.frameElement;
          if (!frameEl || !window.parent || window.parent === window) return null;
          const rect = frameEl.getBoundingClientRect();
          const parentVh = window.parent.innerHeight || window.parent.document.documentElement.clientHeight || 0;
          if (!parentVh || !rect.height) return null;
          const top = Math.max(0, -rect.top);
          const bottom = Math.min(rect.height, parentVh - rect.top);
          if (bottom <= top) return null;
          return { top, bottom };
        } catch (_) {
          return null;
        }
      }

      function readStorage(key) {
        try {

        } catch (_) {

        }

      function writeStorage(key, value) {

          else window.localStorage.setItem(key, value);

      }

      function isReducedMotion() {

      function toBase64AsciiSafe(str) {
        try {
          return btoa(str);
        } catch (_) {
          const bytes = new TextEncoder().encode(str);
          let bin = '';
          for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin);
        }
      }

      function isValidRelativeExamUrl(url) {

      function inferGroupName(categoryId, categoryName) {
        if (Object.prototype.hasOwnProperty.call(CATEGORY_GROUP_MAP, categoryId)) {
          return CATEGORY_GROUP_MAP[categoryId];
        }
        const name = String(categoryName || '');
        if (/能力|基础|词汇/i.test(name)) return '能力测试';
        if (/SAT|ACT|GRE|GMAT|AP|SSAT|ISEE|A-?Level|IB/i.test(name)) return '升学类';
        return '语言类';
      }

      function normalizeApiCatalog(payload) {
        if (!payload || !Array.isArray(payload.data)) {
          throw new Error('INVALID_CATALOG_PAYLOAD');
        }
        const rawCategories = [];
        for (let i = 0; i < payload.data.length; i++) {
          const cat = payload.data[i];
          if (!cat || typeof cat !== 'object') continue;
          const catId = Number(cat.categoryId);
          const catName = String(cat.categoryName || '').trim();
          if (!catName) continue;
          const groupName = inferGroupName(catId, catName);
          const subGroups = Array.isArray(cat.exams) ? cat.exams : [];
          const catExams = [];
          for (let j = 0; j < subGroups.length; j++) {
            const sg = subGroups[j];
            if (!sg || typeof sg !== 'object') continue;
            const sgName = String(sg.name || '').trim();
            const items = Array.isArray(sg.exams) ? sg.exams : [];
            for (let k = 0; k < items.length; k++) {
              const item = items[k];
              if (!item || typeof item !== 'object') continue;
              if (item.inshow === false) continue;
              const title = String(item.title || '').trim();
              const relUrl = String(item.url || '').trim();
              if (!title || !isValidRelativeExamUrl(relUrl)) continue;
              const structs = Array.isArray(item.structs)
                ? item.structs.map((s) => String(s || '').trim()).filter(Boolean)
                : [];
              catExams.push({
                id: item.id == null ? null : item.id,
                title: title,
                groupName: groupName,
                categoryId: Number.isFinite(catId) ? catId : 0,
                categoryName: catName,
                subGroupName: sgName,
                suggesttimeMinutes: Number(item.suggesttime) || 0,
                structs: structs,
                relativeExamUrl: relUrl,
                source: 'public_api'
              });
            }
          }
          if (catExams.length > 0) {
            rawCategories.push({
              groupName: groupName,
              categoryId: Number.isFinite(catId) ? catId : 9999,
              categoryName: catName,
              originalIndex: i,
              exams: catExams
            });
          }
        }

        const hasVocab = rawCategories.some((c) =>
          c.exams.some((e) => e.relativeExamUrl === '/org/vocabulary/index.html')
        );
        if (!hasVocab) {
          rawCategories.push({
            groupName: BUILTIN_VOCAB_EXAM.groupName,
            categoryId: BUILTIN_VOCAB_EXAM.categoryId,
            categoryName: BUILTIN_VOCAB_EXAM.categoryName,
            originalIndex: 9999,
            exams: [{ ...BUILTIN_VOCAB_EXAM, structs: BUILTIN_VOCAB_EXAM.structs.slice() }]
          });
        }

        rawCategories.sort((a, b) => {
          const ga = GROUP_ORDER.indexOf(a.groupName);
          const gb = GROUP_ORDER.indexOf(b.groupName);
          const gDiff = (ga === -1 ? 99 : ga) - (gb === -1 ? 99 : gb);
          if (gDiff !== 0) return gDiff;
          const ca = CATEGORY_ORDER.indexOf(a.categoryId);
          const cb = CATEGORY_ORDER.indexOf(b.categoryId);
          const cDiff = (ca === -1 ? 999 : ca) - (cb === -1 ? 999 : cb);
          if (cDiff !== 0) return cDiff;
          return a.originalIndex - b.originalIndex;
        });

        const flat = [];
        for (let i = 0; i < rawCategories.length; i++) {
          for (let j = 0; j < rawCategories[i].exams.length; j++) {
            flat.push(rawCategories[i].exams[j]);
          }
        }
        if (flat.length === 0) {
          throw new Error('EMPTY_CATALOG');
        }
        return flat;
      }

      function announceSR(message) {
        if (!message) return;
        if (typeof document.ariaNotify === 'function') {
          try {
            document.ariaNotify(message);
            return;
          } catch (_) {}
        }
        if (!srAnnouncer) return;

      function dismissToast(toastEl, restoreFocus) {
        if (!toastEl || !toastEl.isConnected) return;
        if (activeToastTimer) {
          window.clearTimeout(activeToastTimer);
          activeToastTimer = null;
        }
        const hadFocus = toastEl.contains(document.activeElement);
        try {
          if (typeof toastEl.hidePopover === 'function' && toastEl.matches(':popover-open')) {
            toastEl.hidePopover();
          }
        } catch (_) {}
        toastEl.classList.remove('is-open');
        toastEl.remove();
        if (activeToastEl === toastEl) activeToastEl = null;
        if (restoreFocus && hadFocus && lastTriggerBeforeToast && lastTriggerBeforeToast.isConnected) {
          try { lastTriggerBeforeToast.focus({ preventScroll: true }); } catch (_) {}
        }
      }

      function showToast(message, tone) {
        if (!message) return;
        // Per persistent-toast-notifications guidance: do not show toasts while a modal dialog is open
        if (fallbackDialog && fallbackDialog.open) return;

        if (activeToastEl) dismissToast(activeToastEl, false);
        lastTriggerBeforeToast = document.activeElement instanceof HTMLElement ? document.activeElement : null;

        const toast = document.createElement('div');
        toast.className = 'toast-item';
        toast.dataset.tone = tone || 'info';
        toast.setAttribute('popover', 'manual');

        const dot = document.createElement('span');
        dot.className = 'toast-dot';
        dot.setAttribute('aria-hidden', 'true');

        const msgSpan = document.createElement('span');
        msgSpan.className = 'toast-msg';
        msgSpan.textContent = message;

        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'toast-close';
        closeBtn.setAttribute('aria-label', '关闭通知');
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', () => dismissToast(toast, true));

        toast.append(dot, msgSpan, closeBtn);
        const visibleBand = getEmbedVisibleViewportBand();
        if (visibleBand) {
          toast.style.top = Math.max(visibleBand.top + 16, Math.round(visibleBand.bottom - 58)) + 'px';
          toast.style.bottom = 'auto';
        }
        toastRegion.appendChild(toast);
        activeToastEl = toast;

        if (typeof toast.showPopover === 'function') {
          try {
            toast.showPopover();
          } catch (_) {
            toast.classList.add('is-open');
          }
        } else {
          toast.classList.add('is-open');
        }

        announceSR(message);

        const scheduleAutoDismiss = () => {
          if (activeToastTimer) window.clearTimeout(activeToastTimer);
          activeToastTimer = window.setTimeout(() => {
            if (toast.contains(document.activeElement)) return;
            dismissToast(toast, false);
          }, 3200);
        };

        toast.addEventListener('focusin', () => {
          if (activeToastTimer) {
            window.clearTimeout(activeToastTimer);
            activeToastTimer = null;
          }
        });
        toast.addEventListener('focusout', () => {
          window.setTimeout(() => {
            if (toast.isConnected && !toast.contains(document.activeElement)) {
              scheduleAutoDismiss();
            }
          }, 50);
        });

        scheduleAutoDismiss();
      }

      function execCommandCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '-9999px';
        ta.style.fontSize = '16px';
        document.body.appendChild(ta);
        let ok = false;
        try {
          ta.focus({ preventScroll: true });
          ta.select();
          ta.setSelectionRange(0, text.length);
          ok = document.execCommand('copy');
        } catch (_) {
          ok = false;
        } finally {
          document.body.removeChild(ta);
        }
        return ok;
      }

      async function copyTextWithFallback(text, dialogTitle) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function' && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (_) {
            // Fall through to execCommand
          }
        }
        if (execCommandCopy(text)) {
          return true;
        }
        openManualCopyDialog(text, dialogTitle || '手动复制内容');
        return false;
      }

      function openManualCopyDialog(text, title) {
        if (activeToastEl) dismissToast(activeToastEl, false);
        fallbackDialogTitle.textContent = title;
        fallbackTextarea.value = text;
        fallbackRetryBtn.textContent = '全选并重试复制';
        const visibleBand = getEmbedVisibleViewportBand();
        if (visibleBand) {
          fallbackDialog.style.top = Math.round(visibleBand.top + Math.max(16, (visibleBand.bottom - visibleBand.top - 320) / 2)) + 'px';
          fallbackDialog.style.marginTop = '0';
        } else {
          fallbackDialog.style.top = '';
          fallbackDialog.style.marginTop = '';
        }
        if (typeof fallbackDialog.showModal === 'function') {
          if (!fallbackDialog.open) fallbackDialog.showModal();
        } else {
          fallbackDialog.setAttribute('open', '');
        }
        window.requestAnimationFrame(() => {
          fallbackTextarea.focus({ preventScroll: true });
          fallbackTextarea.select();
          try { fallbackTextarea.setSelectionRange(0, text.length); } catch (_) {}
        });
      }

      function flashButtonFeedback(btn, labelText) {
        if (!btn) return;
        const labelSpan = btn.querySelector('span') || btn;
        if (!btn.dataset.origLabel) {
          btn.dataset.origLabel = labelSpan.textContent;
        }
        const prevTimer = buttonFeedbackTimers.get(btn);
        if (prevTimer) window.clearTimeout(prevTimer);

        btn.classList.add('is-copied');
        labelSpan.textContent = labelText;

        const timer = window.setTimeout(() => {
          btn.classList.remove('is-copied');
          if (btn.dataset.origLabel) labelSpan.textContent = btn.dataset.origLabel;
          buttonFeedbackTimers.delete(btn);
        }, 2200);
        buttonFeedbackTimers.set(btn, timer);
      }

      function buildSearchHaystack(exam) {
        const catLower = String(exam.categoryName || '').toLowerCase();
        const synonym = SEARCH_SYNONYMS[catLower] || '';
        return [
          exam.title,
          exam.categoryName,
          exam.groupName,
          exam.subGroupName,
          Array.isArray(exam.structs) ? exam.structs.join(' ') : '',
          synonym
        ].join(' ').toLowerCase();
      }

      function getGroupStats() {
        const counts = new Map();
        for (let i = 0; i < GROUP_ORDER.length; i++) counts.set(GROUP_ORDER[i], 0);
        for (let i = 0; i < state.exams.length; i++) {
          const g = state.exams[i].groupName;
          counts.set(g, (counts.get(g) || 0) + 1);
        }
        const rows = [{ name: '全部', count: state.exams.length }];
        counts.forEach((count, name) => {
          if (count > 0) rows.push({ name, count });
        });
        return rows;
      }

      function getCategoryStats() {
        const map = new Map();
        for (let i = 0; i < state.exams.length; i++) {
          const ex = state.exams[i];
          if (state.group !== '全部' && ex.groupName !== state.group) continue;
          const key = ex.categoryName;
          if (!map.has(key)) {
            map.set(key, {
              categoryId: ex.categoryId,
              categoryName: ex.categoryName,
              groupName: ex.groupName,
              count: 0
            });
          }
          map.get(key).count++;
        }
        return Array.from(map.values());
      }

      function getFilteredExams() {
        const tokens = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
        return state.exams.filter((exam) => {
          if (state.group !== '全部' && exam.groupName !== state.group) return false;
          if (state.category && exam.categoryName !== state.category) return false;
          if (tokens.length > 0) {
            const hay = buildSearchHaystack(exam);
            for (let i = 0; i < tokens.length; i++) {
              if (!hay.includes(tokens[i])) return false;
            }
          }
          return true;
        });
      }

      function syncUrlFromState() {
        try {
          if (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') return;
          const u = new URL(window.location.href);
          if (state.group && state.group !== '全部') u.searchParams.set('group', state.group);
          else u.searchParams.delete('group');
          if (state.category) u.searchParams.set('cat', state.category);
          else u.searchParams.delete('cat');
          if (state.query.trim()) u.searchParams.set('q', state.query.trim());
          else u.searchParams.delete('q');
          window.history.replaceState(null, '', u.toString());
        } catch (_) {}
      }

        }

      function createCopyIcon() {
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('class', 'icon-svg');
        svg.setAttribute('viewBox', '0 0 20 20');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '1.7');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        const rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('x', '7.2');
        rect.setAttribute('y', '7.2');
        rect.setAttribute('width', '9.6');
        rect.setAttribute('height', '9.6');
        rect.setAttribute('rx', '2');
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', 'M4.8 12.8H4.2a1.8 1.8 0 0 1-1.8-1.8V4.2a1.8 1.8 0 0 1 1.8-1.8h6.8a1.8 1.8 0 0 1 1.8 1.8v.6');
        svg.append(rect, path);
        return svg;
      }

      function renderFilterBars() {
        const groupFrag = document.createDocumentFragment();
        const groups = getGroupStats();
        for (let i = 0; i < groups.length; i++) {
          const g = groups[i];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pill pill-group';
          btn.setAttribute('aria-pressed', state.group === g.name ? 'true' : 'false');
          btn.dataset.groupName = g.name;

          const label = document.createElement('span');
          label.textContent = g.name;
          const count = document.createElement('span');
          count.className = 'pill-count';
          count.textContent = String(g.count);

          btn.append(label, count);
          btn.addEventListener('click', () => {
            if (state.group === g.name && !state.category) return;
            state.group = g.name;
            state.category = '';
            syncUrlFromState();
            renderAll(true);
          });
          groupFrag.appendChild(btn);
        }
        groupBar.replaceChildren(groupFrag);

        const catFrag = document.createDocumentFragment();
        const cats = getCategoryStats();
        let activeCatBtn = null;
        for (let i = 0; i < cats.length; i++) {
          const c = cats[i];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pill pill-cat';
          const isActive = state.category === c.categoryName;
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          btn.dataset.catName = c.categoryName;

          const label = document.createElement('span');
          label.textContent = c.categoryName;
          const count = document.createElement('span');
          count.className = 'pill-count';
          count.textContent = String(c.count);

          btn.append(label, count);
          btn.addEventListener('click', () => {
            state.category = state.category === c.categoryName ? '' : c.categoryName;
            syncUrlFromState();
            renderAll(true);
          });
          if (isActive) activeCatBtn = btn;
          catFrag.appendChild(btn);
        }
        catStrip.replaceChildren(catFrag);

        if (activeCatBtn && typeof activeCatBtn.scrollIntoView === 'function') {
          try {
            activeCatBtn.scrollIntoView({
              behavior: isReducedMotion() ? 'auto' : 'smooth',
              inline: 'nearest',
              block: 'nearest'
            });
          } catch (_) {}
        }
      }

      function createExamCard(exam) {
        const card = document.createElement('article');
        card.className = 'exam-card';

        const head = document.createElement('header');
        head.className = 'card-head';

        const meta = document.createElement('div');
        meta.className = 'card-meta';

        const badge = document.createElement('span');
        badge.className = 'cat-badge';
        badge.dataset.group = exam.groupName;
        badge.textContent = exam.categoryName;

        const time = document.createElement('span');
        time.className = 'time-badge';
        time.append(createClockIcon());
        const timeText = document.createElement('span');
        timeText.textContent = (Number(exam.suggesttimeMinutes) || 0) + ' 分钟';
        time.append(timeText);

        meta.append(badge, time);

        const title = document.createElement('h3');
        title.className = 'card-title';
        title.textContent = exam.title;

        head.append(meta, title);

        const structList = document.createElement('ul');
        structList.className = 'struct-list';
        structList.setAttribute('role', 'list');
        structList.setAttribute('aria-label', '考试结构');
        const structs = Array.isArray(exam.structs) && exam.structs.length > 0 ? exam.structs : ['综合测试'];
        for (let i = 0; i < structs.length; i++) {
          const li = document.createElement('li');
          li.className = 'struct-chip';
          li.textContent = structs[i];
          structList.appendChild(li);
        }

        const actions = document.createElement('footer');
        actions.className = 'card-actions';

        const inviteBtn = document.createElement('button');
        inviteBtn.type = 'button';
        inviteBtn.className = 'btn-primary';
        inviteBtn.setAttribute('aria-label', '复制邀请：' + exam.title);
        inviteBtn.append(createCopyIcon());
        const inviteSpan = document.createElement('span');
        inviteSpan.textContent = '复制邀请';
        inviteBtn.append(inviteSpan);
        inviteBtn.addEventListener('click', async () => {
          const url = buildEtUrl(exam);
          const text = buildInvitationText(exam, url, state.inviter);
          const ok = await copyTextWithFallback(text, '复制模考邀请：' + exam.title);
          if (ok) {
            flashButtonFeedback(inviteBtn, '✓ 已复制邀请');
            showToast('✓ 已复制邀请 · ' + exam.title, 'ok');
          }
        });

        const linkBtn = document.createElement('button');
        linkBtn.type = 'button';
        linkBtn.className = 'btn-secondary';
        linkBtn.setAttribute('aria-label', '仅复制链接：' + exam.title);
        const linkSpan = document.createElement('span');
        linkSpan.textContent = '仅复制链接';
        linkBtn.append(linkSpan);
        linkBtn.addEventListener('click', async () => {
          const url = buildEtUrl(exam);
          const ok = await copyTextWithFallback(url, '复制模考链接：' + exam.title);
          if (ok) {
            flashButtonFeedback(linkBtn, '✓ 已复制链接');
            showToast('✓ 已复制链接 · ' + exam.title, 'ok');
          }
        });

        const openLink = document.createElement('a');
        openLink.className = 'btn-link';
        openLink.href = buildEtUrl(exam);
        openLink.target = '_blank';
        openLink.rel = 'noopener noreferrer';
        openLink.setAttribute('aria-label', '打开：' + exam.title + '（新窗口）');
        openLink.textContent = '打开 ↗';

        actions.append(inviteBtn, linkBtn, openLink);
        card.append(head, structList, actions);
        return card;
      }

      function renderCards(shouldAnnounceCount) {
        const filtered = getFilteredExams();
        const total = state.exams.length;
        const hasFilter = state.group !== '全部' || Boolean(state.category) || Boolean(state.query.trim());

        resultCountEl.textContent = hasFilter
          ? '显示 ' + filtered.length + ' / ' + total + ' 套模考'
          : '共 ' + total + ' 套模考';
        resetBtn.hidden = !hasFilter;

        if (filtered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';

          const h = document.createElement('p');
          h.className = 'empty-title';
          h.textContent = '没有找到匹配的模考试卷';

          const d = document.createElement('p');
          d.className = 'empty-desc';
          d.textContent = '可以换个关键词（如 雅思、托福、SAT、C14、口语），或重置当前筛选条件。';

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-primary';
          btn.textContent = '重置筛选';
          btn.addEventListener('click', resetFilters);

          empty.append(h, d, btn);
          examGrid.replaceChildren(empty);
        } else {
          const frag = document.createDocumentFragment();
          for (let i = 0; i < filtered.length; i++) {
            frag.appendChild(createExamCard(filtered[i]));
          }
          examGrid.replaceChildren(frag);
        }

        if (shouldAnnounceCount) {
          if (announceTimer) window.clearTimeout(announceTimer);
          announceTimer = window.setTimeout(() => {
            announceSR('已更新列表，当前显示 ' + filtered.length + ' 套模考');
          }, 260);
        }

        scheduleEmbedHeightReport(false);
      }

      function renderAll(shouldAnnounceCount) {
        updateMetaChips();
        renderFilterBars();
        renderCards(Boolean(shouldAnnounceCount));
      }

      function resetFilters() {
        state.group = '全部';
        state.category = '';
        state.query = '';
        searchInput.value = '';
        searchClear.hidden = true;
        syncUrlFromState();
        renderAll(true);
      }

      function setSyncLoading(loading) {
        state.syncing = loading;
        for (let i = 0; i < syncButtons.length; i++) {
          const btn = syncButtons[i];
          btn.setAttribute('aria-busy', loading ? 'true' : 'false');
          btn.disabled = loading;
          btn.classList.toggle('is-spinning', loading);
          const lbl = btn.querySelector('[data-sync-label="1"]');
          if (lbl) lbl.textContent = loading ? '同步中…' : '同步最新';
        }
      }

      async function syncLatestCatalog() {
        if (state.syncing) return;
        setSyncLoading(true);
        const controller = typeof AbortController === 'function' ? new AbortController() : null;
        const timer = controller ? window.setTimeout(() => controller.abort(), 10000) : null;
        try {
          const resp = await fetch(PUBLIC_API_URL, {
            method: 'GET',
            cache: 'no-store',
            headers: { Accept: 'application/json' },
            signal: controller ? controller.signal : undefined
          });
          if (!resp.ok) throw new Error('HTTP_' + resp.status);
          const payload = await resp.json();
          const normalized = normalizeApiCatalog(payload);
          const now = Date.now();
          state.exams = normalized;
          state.syncedAt = now;
          writeStorage(STORAGE_SYNC_KEY, JSON.stringify({ syncedAt: now, exams: normalized }));

          // Ensure current category filter still exists after sync
          if (state.category && !state.exams.some((e) => e.categoryName === state.category)) {
            state.category = '';
          }
          if (state.group !== '全部' && !state.exams.some((e) => e.groupName === state.group)) {
            state.group = '全部';
          }

          renderAll(false);
          showToast('✓ 已同步最新 · ' + normalized.length + ' 套模考', 'ok');
        } catch (_) {
          syncChip.dataset.tone = 'warn';
          syncChipText.textContent = '离线快照 · ' + state.exams.length + ' 套';
          showToast('同步失败，已保留当前 ' + state.exams.length + ' 套本地快照', 'warn');
        } finally {
          if (timer) window.clearTimeout(timer);
          setSyncLoading(false);
        }
      }

      function initFromUrlAndStorage() {
        restoreCachedSyncIfNewer();

        const params = new URLSearchParams(window.location.search);
        const rawHash = (window.location.hash || '').replace(/^#/, '');
        const hashParams = rawHash.includes('=') ? new URLSearchParams(rawHash) : null;

        // Inviter priority: URL ?inviter=... > localStorage
        const urlInviter = (params.get('inviter') || '').trim();
        const savedInviter = (readStorage(STORAGE_INVITER_KEY) || '').trim();
        state.inviter = urlInviter || savedInviter;
        inviterInput.value = state.inviter;
        inviterClear.hidden = !state.inviter;

        // Search query
        const urlQuery = (params.get('q') || '').trim();
        if (urlQuery) {
          state.query = urlQuery;
          searchInput.value = urlQuery;
          searchClear.hidden = false;
        }

        // Group filter
        const urlGroup = (params.get('group') || (hashParams ? hashParams.get('group') : '') || '').trim();
        if (urlGroup && state.exams.some((e) => e.groupName === urlGroup)) {
          state.group = urlGroup;
        }

        // Category filter (?cat=雅思 or ?cat=9 or #cat=雅思 or #雅思)
        let catRaw = (
          params.get('cat') ||
          params.get('category') ||
          (hashParams ? hashParams.get('cat') || hashParams.get('category') : '') ||
          ''
        ).trim();
        if (!catRaw && rawHash && !rawHash.includes('=')) {
          try { catRaw = decodeURIComponent(rawHash).trim(); } catch (_) { catRaw = rawHash.trim(); }
        }
        if (catRaw) {
          const matchByName = state.exams.find((e) => e.categoryName.toLowerCase() === catRaw.toLowerCase());
          const matchById = /^\d+$/.test(catRaw)
            ? state.exams.find((e) => String(e.categoryId) === catRaw)
            : null;
          const matched = matchByName || matchById;
          if (matched) {
            state.category = matched.categoryName;
            if (state.group !== '全部' && matched.groupName !== state.group) {
              state.group = matched.groupName;
            }
          }
        }
      }

      function bindEvents() {
        // Search input (with IME-safe Enter handling)
        searchInput.addEventListener('input', () => {
          state.query = searchInput.value;
          searchClear.hidden = !state.query;
          syncUrlFromState();
          renderCards(true);
        });

        searchInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            if (event.isComposing || event.keyCode === 229) return;
            searchInput.blur();
          } else if (event.key === 'Escape' && state.query) {
            event.preventDefault();
            state.query = '';
            searchInput.value = '';
            searchClear.hidden = true;
            syncUrlFromState();
            renderCards(true);
          }
        });

        searchClear.addEventListener('click', () => {
          state.query = '';
          searchInput.value = '';
          searchClear.hidden = true;
          syncUrlFromState();
          renderCards(true);
          searchInput.focus({ preventScroll: true });
        });

        // Inviter input (with IME-safe Enter handling)
        inviterInput.addEventListener('input', () => {
          state.inviter = inviterInput.value;
          inviterClear.hidden = !state.inviter;
          writeStorage(STORAGE_INVITER_KEY, state.inviter.trim() || null);
          updateMetaChips();
        });

        inviterInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            if (event.isComposing || event.keyCode === 229) return;
            inviterInput.blur();
            const clean = state.inviter.trim();
            showToast(clean ? '已设置邀请人：' + clean : '已恢复默认通用邀请文案', 'info');
          }
        });

        inviterClear.addEventListener('click', () => {
          state.inviter = '';
          inviterInput.value = '';
          inviterClear.hidden = true;
          writeStorage(STORAGE_INVITER_KEY, null);
          updateMetaChips();
          inviterInput.focus({ preventScroll: true });
        });

        resetBtn.addEventListener('click', resetFilters);

        if (sharePageBtn) {
          sharePageBtn.addEventListener('click', async () => {
            const shareUrl = getStandaloneShareUrl();
            const ok = await copyTextWithFallback(shareUrl, '复制同事分享链接');
            if (ok) {
              flashButtonFeedback(sharePageBtn, '✓ 已复制本页链接');
              showToast('✓ 已复制本页链接，可直接发给同事使用', 'ok');
            }
          });
        }

        for (let i = 0; i < syncButtons.length; i++) {
          syncButtons[i].addEventListener('click', syncLatestCatalog);
        }

        // Manual copy dialog controls & Safari closedby="any" light-dismiss fallback
        fallbackCloseX.addEventListener('click', () => fallbackDialog.close('close'));
        fallbackDialog.addEventListener('close', () => {
          fallbackDialog.returnValue = '';
          fallbackDialog.style.top = '';
          fallbackDialog.style.marginTop = '';
        });

        fallbackRetryBtn.addEventListener('click', () => {
          const text = fallbackTextarea.value;
          fallbackTextarea.focus({ preventScroll: true });
          fallbackTextarea.select();
          try { fallbackTextarea.setSelectionRange(0, text.length); } catch (_) {}
          const ok = execCommandCopy(text);
          if (ok) {
            fallbackDialog.close('copied');
            showToast('✓ 已复制到剪贴板', 'ok');
          } else {
            fallbackRetryBtn.textContent = '已全选，请长按复制';
          }
        });

        if (typeof HTMLDialogElement !== 'undefined' && !('closedBy' in HTMLDialogElement.prototype)) {
          const isOutside = (e, dlg) => {
            const r = dlg.getBoundingClientRect();
            return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
          };
          let pressedOutside = false;
          fallbackDialog.addEventListener('pointerdown', (e) => {
            pressedOutside = isOutside(e, fallbackDialog);
          });
          fallbackDialog.addEventListener('pointerup', (e) => {
            if (pressedOutside && isOutside(e, fallbackDialog)) {
              fallbackDialog.close('backdrop');
            }
            pressedOutside = false;
          });
        }

        // Observe inner content root (.page) — never documentElement — so iframe height updates cannot feed back into a growth loop.
        if (isEmbedMode) {
          if (typeof ResizeObserver === 'function' && pageRoot) {
            const ro = new ResizeObserver(() => {
              scheduleEmbedHeightReport(false);
            });
            ro.observe(pageRoot);
          }
          window.addEventListener('resize', () => scheduleEmbedHeightReport(false));
          window.addEventListener('load', () => scheduleEmbedHeightReport(true));
          if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
            document.fonts.ready.then(() => scheduleEmbedHeightReport(false)).catch(() => {});
          }
        }

        // Parent postMessage: theme synchronization & on-demand embed height re-measurement
        window.addEventListener('message', (event) => {
          const expectedOrigin = getParentTargetOrigin();
          if (expectedOrigin !== '*' && event.origin && event.origin !== expectedOrigin) return;
          const data = event && event.data;
          if (!data || typeof data !== 'object') return;
          if (data.type === 'wayon-mocks-measure') {
            scheduleEmbedHeightReport(true);
            return;
          }
          if (data.type !== 'wayon-theme') return;
          if (data.theme === 'dark' || data.theme === 'light') {
            document.documentElement.setAttribute('data-theme', data.theme);
          } else if (data.theme === 'auto') {
            document.documentElement.removeAttribute('data-theme');
          }
        });
      }

      initFromUrlAndStorage();
      bindEvents();
      renderAll(false);
    })();
  </script>
</body>
</html>
